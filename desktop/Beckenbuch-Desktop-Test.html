<style>
/* Beckenbuch – Gestaltung für den Außeneinsatz: groß, kontrastreich, Hochformat, einhändig. */
:root {
  --text: #111;
  --grund: #fff;
  --flaeche: #f1f3f5;
  --linie: #5c6670;
  --primaer: #0b3d6b;
  --primaer-text: #fff;
  --gefahr: #a1001b;
  --ok: #17602a;
  --warn-grund: #fff3c4;
  --warn-text: #5a3d00;
  --abstand: 16px;
  --knopf-hoehe: 56px;
  font-size: 18px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.4;
}
a { color: var(--primaer); }

/* Kopf */
.kopf {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  background: var(--primaer); color: var(--primaer-text);
  padding: 8px 12px; min-height: 60px;
}
.kopf h1 { flex: 1; font-size: 1.15rem; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
.zurueck, .zurueck-platz {
  width: 48px; height: 48px; flex: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--primaer-text); text-decoration: none; font-size: 2.2rem; line-height: 1;
}
button.zurueck { background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
.speicheranzeige { font-size: .75rem; opacity: .9; white-space: nowrap; }

main { padding: var(--abstand); padding-bottom: 120px; max-width: 720px; margin: 0 auto; }

/* Fuß mit Hauptaktionen – unten, mit dem Daumen erreichbar */
.fuss {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--grund); border-top: 2px solid var(--linie);
}
.fuss > * { flex: 1; }

/* Knöpfe */
.knopf, button.knopf {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  min-height: var(--knopf-hoehe); padding: 8px 14px;
  border: 2px solid var(--primaer); border-radius: 10px;
  background: var(--grund); color: var(--primaer);
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
.knopf.primaer { background: var(--primaer); color: var(--primaer-text); }

.knopf.breit { display: flex; width: 100%; margin: 10px 0; }
.knopf.klein { min-height: 44px; padding: 4px 12px; font-size: .9rem; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }

/* Listen */
.karte {
  display: block; padding: 14px; margin-bottom: 12px;
  border: 2px solid var(--linie); border-radius: 12px; color: var(--text); text-decoration: none;
}
.karte-titel { font-size: 1.15rem; font-weight: 700; }
.karte-zeile { margin-top: 4px; }
.marke {
  display: inline-block; margin: 6px 6px 0 0; padding: 2px 8px;
  border: 1px solid var(--linie); border-radius: 6px; font-size: .8rem; background: var(--flaeche);
}
.marke.warnmarke, .marke.pflicht { background: var(--warn-grund); color: var(--warn-text); border-color: var(--warn-text); }
.stand { font-weight: 700; }
.stand-vollstaendig, .stand-versendet { color: var(--ok); }
.leer { color: #444; font-style: italic; }

.abschnitt { margin: 0 0 24px; }
.abschnitt h2, details summary h2 { font-size: 1.05rem; margin: 0 0 8px; display: inline; }
details summary { cursor: pointer; padding: 6px 0; }

.kapitel-zeile {
  display: grid; grid-template-columns: 4.2em 1fr; gap: 2px 8px;
  padding: 12px; margin-bottom: 8px; border: 2px solid var(--linie); border-radius: 10px;
  color: var(--text); text-decoration: none; min-height: var(--knopf-hoehe);
}
.kapitel-zeile.fertig { border-color: var(--ok); }
.kap-nr { font-weight: 700; }
.kap-titel { font-weight: 600; }
.kap-stand { grid-column: 2; font-size: .85rem; color: #333; }
.pflicht-marke { color: var(--warn-text); font-weight: 400; font-size: .85rem; }

.mindest { list-style: none; padding: 0; margin: 8px 0 0; }
.mindest li { padding: 6px 0; border-bottom: 1px solid #ccc; }
.mindest .ok { color: var(--ok); }
.mindest .fehlt { color: var(--gefahr); font-weight: 600; }

.segment { display: flex; gap: 6px; flex-wrap: wrap; }
.segment button {
  flex: 1 1 30%; min-height: var(--knopf-hoehe); border: 2px solid var(--primaer); border-radius: 10px;
  background: var(--grund); color: var(--primaer); font: inherit; font-weight: 600;
}
.segment button.aktiv { background: var(--primaer); color: var(--primaer-text); }

.hinweis { background: var(--flaeche); border-left: 6px solid var(--linie); padding: 10px 12px; margin: 0 0 16px; border-radius: 6px; }

.fehlertext { color: var(--gefahr); font-weight: 600; }

.feld-label { font-weight: 700; display: block; }

.feld.klein { margin-bottom: 8px; }
.feld.klein .feld-label { font-weight: 600; font-size: .9rem; }

input[type=text], input[type=date], textarea {
  width: 100%; min-height: var(--knopf-hoehe); padding: 10px 12px;
  border: 2px solid var(--linie); border-radius: 10px; font: inherit; color: var(--text); background: var(--grund);
}
textarea { resize: vertical; min-height: 96px; }
.zahl-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.zahl-zeile input { flex: 1; min-width: 0; }

.optionen.zwei { flex-direction: row; }

<script type="module">
// ===== js/db.js =====
const Modul_db = await (async () => {
// Speicher auf dem Gerät (IndexedDB).
// Grundsatz: Jede Änderung wird sofort geschrieben. Schreibvorgänge für denselben Datensatz
// werden zusammengefasst, damit immer der neueste Stand gespeichert ist.

const DB_NAME = 'beckenbuch';
const DB_VERSION = 1;
const STORES = ['einstellungen', 'vorlagen', 'buecher', 'fotos', 'skizzen'];

let dbPromise = null;

function oeffneDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const name of STORES) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('Die Datenbank ist durch ein anderes Fenster blockiert.'));
  });
  return dbPromise;
}

function tx(db, store, modus) {
  // „strict“: Der Browser meldet erst Erfolg, wenn die Daten dauerhaft geschrieben sind.
  try {
    return db.transaction(store, modus, { durability: 'strict' });
  } catch {
    return db.transaction(store, modus);
  }
}

async function lese(store, id) {
  const db = await oeffneDb();
  return new Promise((resolve, reject) => {
    const r = tx(db, store, 'readonly').objectStore(store).get(id);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

async function alle(store) {
  const db = await oeffneDb();
  return new Promise((resolve, reject) => {
    const r = tx(db, store, 'readonly').objectStore(store).getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

async function schreibeJetzt(store, obj) {
  const db = await oeffneDb();
  return new Promise((resolve, reject) => {
    const t = tx(db, store, 'readwrite');
    t.objectStore(store).put(obj);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('Speichern abgebrochen'));
  });
}

async function loesche(store, id) {
  const db = await oeffneDb();
  return new Promise((resolve, reject) => {
    const t = tx(db, store, 'readwrite');
    t.objectStore(store).delete(id);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

// ---------- Warteschlange je Datensatz ----------
const laufend = new Map(); // key -> Promise
const wartend = new Map(); // key -> neuester Stand
let fehlerMelder = () => {};
let zustandMelder = () => {};

function beiSpeicherFehler(fn) { fehlerMelder = fn; }
function beiSpeicherZustand(fn) { zustandMelder = fn; }

function anzahlOffen() {
  return laufend.size + wartend.size;
}

// Speichert obj. Kopie wird sofort angefertigt, damit spätere Änderungen am Objekt nicht stören.
function speichere(store, obj) {
  const key = `${store}:${obj.id}`;
  const kopie = structuredClone(obj);
  if (laufend.has(key)) {
    wartend.set(key, { store, obj: kopie });
    zustandMelder(anzahlOffen());
    return laufend.get(key);
  }
  const p = (async () => {
    let aktuell = { store, obj: kopie };
    while (aktuell) {
      try {
        await schreibeJetzt(aktuell.store, aktuell.obj);
      } catch (e) {
        fehlerMelder(e);
      }
      aktuell = wartend.get(key);
      wartend.delete(key);
    }
    laufend.delete(key);
    zustandMelder(anzahlOffen());
  })();
  laufend.set(key, p);
  zustandMelder(anzahlOffen());
  return p;
}

async function allesGespeichert() {
  while (laufend.size) await Promise.all([...laufend.values()]);
}

// ---------- Dauerhafter Speicher ----------
async function speicherStatus() {
  const s = { dauerhaft: null, belegtMB: null, verfuegbarMB: null };
  if (navigator.storage) {
    if (navigator.storage.persisted) s.dauerhaft = await navigator.storage.persisted();
    if (navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      s.belegtMB = Math.round((e.usage || 0) / 1e5) / 10;
      s.verfuegbarMB = Math.round((e.quota || 0) / 1e6);
    }
  }
  return s;
}

async function dauerhaftBeantragen() {
  if (navigator.storage && navigator.storage.persist) return navigator.storage.persist();
  return false;
}

return { STORES, oeffneDb, lese, alle, loesche, beiSpeicherFehler, beiSpeicherZustand, anzahlOffen, speichere, allesGespeichert, speicherStatus, dauerhaftBeantragen };
})();

// ===== js/zahlen.js =====
const Modul_zahlen = await (async () => {
// Zahlen und Maße lesen – getippt oder mit der Tastatur diktiert.
// Grundsatz: keine stille Korrektur, keine stille Umrechnung. Was nicht eindeutig ist,
// wird als „nicht erkannt“ gemeldet und bleibt als Text stehen.

// ---------- einfache Dezimalzahl ----------
// Liefert eine Zahl oder null. Leerzeichen innerhalb der Zahl werden nicht entfernt
// („2 40“ könnte 2,40 oder 240 heißen).
function leseDezimal(text) {
  if (text === undefined || text === null) return null;
  const t = String(text).trim();
  if (t === '') return null;
  // Komma oder Punkt als Dezimaltrenner, aber nicht beides und höchstens einmal.
  if (!/^[-+]?\d+([.,]\d+)?$/.test(t)) return null;
  return Number(t.replace(',', '.'));
}

function zahlDE(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '';
  return String(n).replace('.', ',');
}

// ---------- Zahlwörter ----------
const EINER = {
  null: 0, ein: 1, eins: 1, eine: 1, einen: 1, zwei: 2, zwo: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9,
};
const ZEHN_BIS_NEUNZEHN = {
  zehn: 10, elf: 11, zwölf: 12, dreizehn: 13, vierzehn: 14, fünfzehn: 15, sechzehn: 16, siebzehn: 17, achtzehn: 18, neunzehn: 19,
};
const ZEHNER = { zwanzig: 20, dreißig: 30, dreissig: 30, vierzig: 40, fünfzig: 50, sechzig: 60, siebzig: 70, achtzig: 80, neunzig: 90 };

// „zweiunddreißig“, „hundertfünfzig“, „zweitausenddreihundert“, „eineinhalb“ → Zahl, sonst null.
function zahlwort(wort) {
  let w = String(wort || '').toLowerCase().trim();
  if (!w) return null;
  // „eineinhalb“, „zweieinhalb“ …
  const halb = w.match(/^(.+?)einhalb$/);
  if (halb) {
    const g = zahlwort(halb[1] === 'ein' ? 'eins' : halb[1]);
    return g === null ? null : g + 0.5;
  }
  if (w === 'halb' || w === 'einhalb') return 0.5;
  const unter100 = (s) => {
    if (s === '') return 0;
    if (s in EINER) return EINER[s];
    if (s in ZEHN_BIS_NEUNZEHN) return ZEHN_BIS_NEUNZEHN[s];
    if (s in ZEHNER) return ZEHNER[s];
    const m = s.match(/^(.+)und(.+)$/);
    if (m && m[1] in EINER && m[2] in ZEHNER) return EINER[m[1]] + ZEHNER[m[2]];
    return null;
  };
  const unter1000 = (s) => {
    const i = s.indexOf('hundert');
    if (i < 0) return unter100(s);
    const vor = s.slice(0, i), nach = s.slice(i + 7);
    const h = vor === '' ? 1 : unter100(vor);
    const r = unter100(nach);
    return h === null || r === null || h > 9 ? null : h * 100 + r;
  };
  const i = w.indexOf('tausend');
  if (i < 0) return unter1000(w);
  const t = w.slice(0, i) === '' ? 1 : unter1000(w.slice(0, i));
  const r = unter1000(w.slice(i + 7));
  return t === null || r === null ? null : t * 1000 + r;
}

// Ein Zahl-Teil: „2,40“, „2.4“, „zwei komma vier null“, „2 komma 40“, „zweiunddreißig“.
function lesezahlteil(s) {
  const t = s.trim();
  if (t === '') return null;
  const d = leseDezimal(t);
  if (d !== null) return d;
  const km = t.match(/^(\S+)\s+komma\s+(.+)$/);
  if (km) {
    const ganz = leseDezimal(km[1]) ?? zahlwort(km[1]);
    if (ganz === null || !Number.isInteger(ganz)) return null;
    // Nachkommastellen: Ziffern („40“) oder einzelne Zahlwörter („vier null“)
    let nach = '';
    if (/^\d+$/.test(km[2])) nach = km[2];
    else {
      for (const z of km[2].split(/\s+/)) {
        const n = zahlwort(z);
        if (n === null || n > 9 || !Number.isInteger(n)) return null;
        nach += String(n);
      }
    }
    return Number(`${ganz}.${nach}`);
  }
  if (/^[a-zäöüß]+$/.test(t)) return zahlwort(t);
  return null;
}

// ---------- Einheiten ----------
const EINHEITEN = [
  ['m', ['m', 'meter', 'metern', 'mtr']],
  ['cm', ['cm', 'zentimeter', 'zentimetern']],
  ['mm', ['mm', 'millimeter', 'millimetern']],
  ['km', ['km', 'kilometer', 'kilometern']],
  ['ha', ['ha', 'hektar']],
  ['m²', ['m²', 'm2', 'qm', 'quadratmeter', 'quadratmetern']],
  ['m³', ['m³', 'm3', 'cbm', 'kubikmeter', 'kubikmetern']],
  ['l/s', ['l/s', 'liter pro sekunde', 'liter je sekunde', 'l pro s', 'liter/sekunde']],
  ['%', ['%', 'prozent']],
  ['°', ['°', 'grad']],
];
const EINHEIT_INDEX = new Map();
for (const [norm, namen] of EINHEITEN) for (const n of namen) EINHEIT_INDEX.set(n, norm);

function normEinheit(e) {
  if (!e) return '';
  const k = String(e).toLowerCase().trim();
  return EINHEIT_INDEX.get(k) || String(e).trim();
}

const FAKTOR = {
  laenge: { mm: 0.001, cm: 0.01, m: 1, km: 1000 },
  flaeche: { 'm²': 1, ha: 10000 },
};

// Umrechnung zwischen verträglichen Einheiten oder null.
function umrechnen(zahl, von, nach) {
  von = normEinheit(von); nach = normEinheit(nach);
  if (von === nach) return zahl;
  for (const f of Object.values(FAKTOR)) {
    if (von in f && nach in f) return Math.round((zahl * f[von] / f[nach]) * 1e6) / 1e6;
  }
  return null;
}

// ---------- Maß lesen ----------
// Ergebnis: { erkannt, art: 'zahl'|'dn'|'verhaeltnis', zahl, einheit, a, b, hinweis }
// zahl bei Verhältnis 1:n ist n; einheit '' wenn keine diktiert wurde.
function leseMass(text) {
  const roh = String(text ?? '').trim();
  const nicht = (hinweis) => ({ erkannt: false, art: null, zahl: null, einheit: '', hinweis });
  if (!roh) return nicht('leer');
  let t = roh.toLowerCase()
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ')
    .replace(/^(ca\.?|circa|etwa|ungefähr)\s+/, '')
    .replace(/[.!]$/, '')
    .trim();

  // Nennweite: „DN 150“, „D N 150“, „de en 150“, „DN150“
  const dn = t.match(/^(?:d\s?n|de\s?en)\s*(\S+)$/);
  if (dn) {
    const z = lesezahlteil(dn[1]);
    if (z === null || !Number.isInteger(z)) return nicht('Nennweite nicht erkannt');
    return { erkannt: true, art: 'dn', zahl: z, einheit: 'DN', hinweis: '' };
  }

  // Verhältnis: „1 zu 2“, „1:2“, „eins zu zwei“, „1 zu 1,5“
  const vh = t.match(/^(\S+(?:\s+komma\s+\S+)?)\s*(?:zu|:)\s*(\S+(?:\s+komma\s+\S+)?)$/);
  if (vh) {
    const a = lesezahlteil(vh[1]), b = lesezahlteil(vh[2]);
    if (a === null || b === null || a === 0) return nicht('Verhältnis nicht erkannt');
    return { erkannt: true, art: 'verhaeltnis', a, b, zahl: Math.round((b / a) * 1e6) / 1e6, einheit: '1:n', hinweis: '' };
  }

  // „2 Meter 40“ → 2,40 m (gesprochene Zentimeter nach ganzen Metern)
  const mz = t.match(/^(\S+) (?:meter|metern|m) (\S+)$/);
  if (mz) {
    const m = lesezahlteil(mz[1]), cm = lesezahlteil(mz[2]);
    if (m !== null && Number.isInteger(m) && cm !== null && Number.isInteger(cm) && cm < 100) {
      return { erkannt: true, art: 'zahl', zahl: m + cm / 100, einheit: 'm', hinweis: `als ${zahlDE(m + cm / 100)} m gelesen` };
    }
  }

  // Zahl mit optionaler Einheit (längste passende Einheit am Ende)
  let einheit = '';
  let zahlTeil = t;
  const namen = [...EINHEIT_INDEX.keys()].sort((x, y) => y.length - x.length);
  for (const n of namen) {
    if (t === n) break;
    if (t.endsWith(n)) {
      const vor = t.slice(0, t.length - n.length);
      // Einheit muss abgetrennt sein oder direkt an einer Ziffer hängen („2,40m“)
      if (vor.endsWith(' ') || /\d$/.test(vor) || /^[%°]/.test(n)) {
        einheit = EINHEIT_INDEX.get(n);
        zahlTeil = vor.trim();
        break;
      }
    }
  }
  const z = lesezahlteil(zahlTeil);
  if (z === null) return nicht(/\d\s+\d/.test(zahlTeil) ? 'mehrdeutig (Leerzeichen in der Zahl)' : 'keine Zahl erkannt');
  return { erkannt: true, art: 'zahl', zahl: z, einheit, hinweis: '' };
}

// Vergleich der erkannten Einheit mit der Einheit des Feldes.
// 'ohne' (nichts diktiert), 'gleich', 'umrechenbar', 'fremd'
function einheitPasst(erkannt, feldEinheit) {
  const e = normEinheit(erkannt), f = normEinheit(feldEinheit);
  if (!e) return 'ohne';
  if (!f) return 'fremd';
  if (e === f) return 'gleich';
  return umrechnen(1, e, f) === null ? 'fremd' : 'umrechenbar';
}

// Text für die Anzeige eines erkannten Maßes.
function massText(m) {
  if (!m || !m.erkannt) return '';
  if (m.art === 'dn') return `DN ${m.zahl}`;
  if (m.art === 'verhaeltnis') return `${zahlDE(m.a)} : ${zahlDE(m.b)}`;
  return `${zahlDE(m.zahl)}${m.einheit ? ` ${m.einheit}` : ''}`;
}

return { leseDezimal, zahlDE, zahlwort, normEinheit, umrechnen, leseMass, einheitPasst, massText };
})();

// ===== js/masse.js =====
const Modul_masse = await (async () => {
// Maße in Zahlfeldern: Wortlaut bleibt gespeichert, der erkannte Wert wird zur Bestätigung angezeigt.
// Reine Logik, ohne Bildschirm – automatisch testbar.
//
// Eintrag eines Zahlfeldes im Beckenbuch:
// { wert: '<Wortlaut>', mass: { art, zahl, einheit, a, b, umgerechnetAus } | null, herkunft: 'gemessen'|'geschaetzt'|'abgelesen'|null }
// `mass` ist nur gesetzt, wenn der Wert eindeutig war oder bestätigt wurde.
const { leseMass, einheitPasst, umrechnen, normEinheit, massText, zahlDE } = Modul_zahlen;
const HERKUNFT = { gemessen: 'gemessen', geschaetzt: 'geschätzt', abgelesen: 'vom Schild/Plan abgelesen' };

// Welche Art von Wert das Feld erwartet.
function erwarteteArt(feld) {
  if (feld.format === 'verhaeltnis' || normEinheit(feld.einheit) === '1:n') return 'verhaeltnis';
  if (feld.format === 'dn' || feld.einheit === 'DN') return 'dn';
  return 'zahl';
}

// Bewertet eine Eingabe für ein Feld.
// zustand: 'leer' | 'auto' (eindeutig, ohne Rückfrage übernommen) | 'bestaetigen' (erkannt, bitte bestätigen)
//        | 'umrechnen' (Einheit passt, aber andere Größe – Umrechnung nur auf Tipp) | 'fremd' (Einheit/Art passt nicht)
//        | 'unerkannt' (bleibt Text, zur Prüfung)
function bewerteMassEingabe(text, feld) {
  const t = String(text ?? '').trim();
  if (!t) return { zustand: 'leer', mass: null };
  const m = leseMass(t);
  if (!m.erkannt) return { zustand: 'unerkannt', mass: null, hinweis: m.hinweis };
  const soll = erwarteteArt(feld);
  if (m.art !== soll) {
    return { zustand: 'fremd', mass: m, hinweis: `${massText(m)} passt nicht zu diesem Feld (erwartet: ${soll === 'verhaeltnis' ? 'Verhältnis 1 : n' : soll === 'dn' ? 'Nennweite DN' : 'Zahl'}).` };
  }
  if (m.art === 'zahl') {
    const passt = einheitPasst(m.einheit, feld.einheit);
    if (passt === 'fremd') return { zustand: 'fremd', mass: m, hinweis: `Einheit ${m.einheit} passt nicht zum Feld${feld.einheit ? ` (${feld.einheit})` : ''}.` };
    if (passt === 'umrechenbar') {
      const z = umrechnen(m.zahl, m.einheit, feld.einheit);
      return {
        zustand: 'umrechnen', mass: m,
        umgerechnet: { art: 'zahl', zahl: z, einheit: normEinheit(feld.einheit), umgerechnetAus: massText(m) },
        hinweis: `Diktiert in ${m.einheit}, das Feld ist in ${feld.einheit}.`,
      };
    }
  }
  // Eindeutig nur bei Ziffern (+ Einheit) ohne Deutung; Zahlwörter oder „2 Meter 40“ werden zur Bestätigung angezeigt.
  const nurZiffern = /^[-+]?\d+([.,]\d+)?\s*[a-zA-Zäöü²³/%°]*\.?$/.test(t) || /^\d+\s*(zu|:)\s*\d+([.,]\d+)?$/i.test(t) || /^DN\s?\d+$/i.test(t);
  const mass = { art: m.art, zahl: m.zahl, einheit: m.art === 'zahl' ? (m.einheit || normEinheit(feld.einheit)) : m.einheit, ...(m.art === 'verhaeltnis' ? { a: m.a, b: m.b } : {}) };
  return { zustand: nurZiffern && !m.hinweis ? 'auto' : 'bestaetigen', mass, hinweis: m.hinweis };
}

// Zustand eines gespeicherten Eintrags: 'leer' | 'ok' | 'pruefen'
function massZustand(feld, eintrag) {
  const t = String((eintrag && eintrag.wert) ?? '').trim();
  if (!t) return 'leer';
  return eintrag.mass ? 'ok' : 'pruefen';
}

// Anzeige des übernommenen Wertes, z. B. „2,4 m (gemessen)“.
function massAnzeige(eintrag) {
  if (!eintrag || !eintrag.mass) return '';
  const m = eintrag.mass;
  let s = m.art === 'verhaeltnis' ? `${zahlDE(m.a)} : ${zahlDE(m.b)}` : m.art === 'dn' ? `DN ${m.zahl}` : `${zahlDE(m.zahl)}${m.einheit ? ` ${m.einheit}` : ''}`;
  if (m.umgerechnetAus) s += ` (umgerechnet aus ${m.umgerechnetAus})`;
  if (eintrag.herkunft) s += ` – ${HERKUNFT[eintrag.herkunft]}`;
  return s;
}

return { HERKUNFT, erwarteteArt, bewerteMassEingabe, massZustand, massAnzeige };
})();

// ===== js/gliederung.js =====
const Modul_gliederung = await (async () => {
// Logik rund um die Gliederung (Vorlage) und den Bearbeitungsstand eines Beckenbuchs.
// Reine Funktionen ohne Bildschirm und ohne Speicher – deshalb automatisch testbar.
const { massZustand } = Modul_masse;
const STATUS = {
  erfasst: 'erfasst',
  nicht_vorhanden: 'nicht vorhanden',
  nicht_zugaenglich: 'nicht zugänglich',
  offen: 'offen',
  aus_akten: 'aus Akten',
  leer: 'noch leer',
};

// Status, die von Hand gesetzt werden können (erfasst ergibt sich aus dem Wert).
const HAND_STATUS = ['nicht_vorhanden', 'nicht_zugaenglich', 'offen', 'aus_akten'];

// Diese Status gelten als „geklärt“ für den Fortschritt.
const GEKLAERT = new Set(['erfasst', 'nicht_vorhanden', 'nicht_zugaenglich']);

const FELDARTEN = ['text', 'langtext', 'zahl', 'datum', 'auswahl', 'mehrfach', 'janein', 'foto', 'skizze', 'tabelle', 'pruefprotokoll'];

const BUCH_STAND = {
  in_arbeit: 'in Arbeit',
  vor_ort_fertig: 'vor Ort fertig',
  vollstaendig: 'vollständig',
  versendet: 'versendet',
};

function feldKey(kapitelId, feldId) {
  return `${kapitelId}.${feldId}`;
}

// ---------- Prüfung einer Gliederungsdatei ----------
function pruefeGliederung(g) {
  const fehler = [];
  if (!g || typeof g !== 'object') return ['Die Datei enthält keine Gliederung.'];
  if (g.format !== 1) fehler.push('Unbekanntes Format (erwartet: "format": 1).');
  if (!g.vorlage) fehler.push('Name der Vorlage ("vorlage") fehlt.');
  if (!g.version) fehler.push('Version ("version") fehlt.');
  if (!Array.isArray(g.kapitel) || g.kapitel.length === 0) fehler.push('Keine Kapitel vorhanden.');
  const tbIds = new Set((g.teilbauwerke || []).map((t) => t.id));
  const stIds = new Set((g.stammdaten || []).map((s) => s.id));
  const kapIds = new Set();
  const alleKeys = new Set();
  for (const k of g.kapitel || []) {
    if (!k.id) { fehler.push('Ein Kapitel hat keine "id".'); continue; }
    if (kapIds.has(k.id)) fehler.push(`Kapitel-ID doppelt: ${k.id}`);
    kapIds.add(k.id);
    pruefeSichtbar(k.sichtbarWenn, tbIds, `Kapitel ${k.id}`, fehler);
    const feldIds = new Set();
    for (const f of k.felder || []) {
      const wo = `Feld ${k.id}.${f.id}`;
      if (!f.id) { fehler.push(`Kapitel ${k.id}: Feld ohne "id".`); continue; }
      if (feldIds.has(f.id)) fehler.push(`${wo} ist doppelt.`);
      feldIds.add(f.id);
      alleKeys.add(feldKey(k.id, f.id));
      if (!f.label) fehler.push(`${wo}: "label" fehlt.`);
      if (!FELDARTEN.includes(f.art)) fehler.push(`${wo}: unbekannte Feldart "${f.art}".`);
      if ((f.art === 'auswahl' || f.art === 'mehrfach') && !(Array.isArray(f.optionen) && f.optionen.length)) {
        fehler.push(`${wo}: Auswahlfeld ohne "optionen".`);
      }
      if (f.art === 'tabelle' && !(Array.isArray(f.spalten) && f.spalten.length)) fehler.push(`${wo}: Tabelle ohne "spalten".`);
      if (f.stammdaten && !stIds.has(f.stammdaten)) fehler.push(`${wo}: Stammdatum "${f.stammdaten}" ist nicht definiert.`);
      pruefeSichtbar(f.sichtbarWenn, tbIds, wo, fehler);
    }
  }
  const index = new Map();
  for (const k of g.kapitel || []) for (const f of k.felder || []) if (k.id && f.id) index.set(feldKey(k.id, f.id), f);
  for (const k of g.kapitel || []) {
    for (const f of k.felder || []) {
      const wo = `Feld ${k.id}.${f.id}`;
      if (f.aus && !alleKeys.has(f.aus)) fehler.push(`${wo}: Verweis "aus": "${f.aus}" zeigt auf kein Feld.`);
      if (f.aus && index.has(f.aus) && ['foto', 'skizze'].includes(f.art) && index.get(f.aus).art !== f.art) {
        fehler.push(`${wo}: "aus" muss auf ein Feld derselben Art (${f.art}) zeigen.`);
      }
      // Marken einer Skizze sind mit einer Tabelle verknüpft (Spalte "nr"), z. B. Eingriffsstellen.
      if (f.marken) {
        const t = index.get(f.marken);
        if (f.art !== 'skizze') fehler.push(`${wo}: "marken" gibt es nur bei Skizzen.`);
        if (!t) fehler.push(`${wo}: "marken": "${f.marken}" zeigt auf kein Feld.`);
        else if (t.art !== 'tabelle' || !(t.spalten || []).some((s) => s.id === 'nr')) fehler.push(`${wo}: "marken" muss auf eine Tabelle mit Spalte "nr" zeigen.`);
      }
      if (f.fotosJeZeile && f.art !== 'tabelle') fehler.push(`${wo}: "fotosJeZeile" gibt es nur bei Tabellen.`);
      if (f.art === 'pruefprotokoll') {
        const pk = (g.kapitel || []).find((x) => x.id === f.protokoll);
        if (!pk || !pk.protokoll || !Array.isArray(pk.protokoll.gruppen)) fehler.push(`${wo}: "protokoll" muss auf ein Kapitel mit Protokoll (gruppen) zeigen.`);
      }
      if (f.format && !['verhaeltnis', 'dn'].includes(f.format)) fehler.push(`${wo}: unbekanntes "format" "${f.format}".`);
    }
  }
  for (const m of g.mindestumfang || []) {
    for (const key of m.felder || []) {
      if (!alleKeys.has(key)) fehler.push(`Mindestumfang "${m.label}": Feld ${key} gibt es nicht.`);
    }
  }
  return fehler;
}

function pruefeSichtbar(s, tbIds, wo, fehler) {
  if (!s) return;
  for (const id of s.teilbauwerk || []) {
    if (!tbIds.has(id)) fehler.push(`${wo}: Teilbauwerk "${id}" in "sichtbarWenn" ist nicht definiert.`);
  }
}

// ---------- Sichtbarkeit ----------
function istSichtbar(element, buch) {
  const s = element.sichtbarWenn;
  if (!s || !s.teilbauwerk || s.teilbauwerk.length === 0) return true;
  const gewaehlt = new Set(buch.teilbauwerke || []);
  return s.teilbauwerk.some((id) => gewaehlt.has(id));
}

function sichtbareKapitel(g, buch) {
  const zu = new Set(buch.zugeschaltet || []);
  return g.kapitel.filter((k) => (!k.zuschaltbar || zu.has(k.id)) && istSichtbar(k, buch));
}

function sichtbareFelder(kapitel, buch) {
  return (kapitel.felder || []).filter((f) => istSichtbar(f, buch));
}

// ---------- Werte und Status ----------
function istLeer(feld, wert) {
  if (wert === undefined || wert === null) return true;
  switch (feld.art) {
    case 'janein':
      return wert !== true && wert !== false;
    case 'mehrfach':
    case 'foto':
    case 'skizze':
      return !Array.isArray(wert) || wert.length === 0;
    case 'tabelle':
      return !Array.isArray(wert) || !wert.some((z) => zeileHatInhalt(feld, z));
    case 'pruefprotokoll':
      return typeof wert !== 'object' || (!wert.datum && Object.keys(wert.punkte || {}).length === 0);
    default:
      return String(wert).trim() === '';
  }
}

// Vorschlagszeilen aus der Vorlage (Beispiele) zählen erst, wenn sie bestätigt oder bearbeitet wurden.
function zeileHatInhalt(feld, zeile) {
  if (zeile && zeile._vorschlag) return false;
  if (zeile && Array.isArray(zeile.fotos) && zeile.fotos.length) return true;
  return (feld.spalten || []).some((s) => zeile && zeile[s.id] !== undefined && String(zeile[s.id]).trim() !== '');
}

// Wert eines Feldes – bei "aus"-Feldern der Wert des Bezugsfeldes.
function wertVon(g, buch, kapitelId, feld) {
  if (feld.aus) {
    const e = (buch.werte || {})[feld.aus];
    return e ? e.wert : undefined;
  }
  const e = (buch.werte || {})[feldKey(kapitelId, feld.id)];
  return e ? e.wert : undefined;
}

function feldStatus(g, buch, kapitelId, feld) {
  const e = (buch.werte || {})[feldKey(kapitelId, feld.id)];
  if (!feld.aus && e && e.status && HAND_STATUS.includes(e.status)) return e.status;
  return istLeer(feld, wertVon(g, buch, kapitelId, feld)) ? 'leer' : 'erfasst';
}

function kapitelFortschritt(g, buch, kapitel) {
  const felder = sichtbareFelder(kapitel, buch).filter((f) => !f.aus);
  const r = { gesamt: felder.length, geklaert: 0, offen: 0, aus_akten: 0, leer: 0, pflichtLeer: 0, pruefen: 0 };
  for (const f of felder) {
    const st = feldStatus(g, buch, kapitel.id, f);
    if (f.art === 'zahl' && massZustand(f, (buch.werte || {})[feldKey(kapitel.id, f.id)]) === 'pruefen') r.pruefen++;
    if (GEKLAERT.has(st)) r.geklaert++;
    else if (st === 'offen') r.offen++;
    else if (st === 'aus_akten') r.aus_akten++;
    else r.leer++;
    if (f.pflicht && st === 'leer') r.pflichtLeer++;
  }
  return r;
}

function mindestumfang(g, buch) {
  const index = feldIndex(g);
  return (g.mindestumfang || []).map((m) => {
    const fehlend = (m.felder || []).filter((key) => {
      const t = index.get(key);
      if (!t) return true;
      return feldStatus(g, buch, t.kapitel.id, t.feld) !== 'erfasst';
    });
    return { label: m.label, erfuellt: fehlend.length === 0, fehlend };
  });
}

function feldIndex(g) {
  const m = new Map();
  for (const k of g.kapitel) for (const f of k.felder || []) m.set(feldKey(k.id, f.id), { kapitel: k, feld: f });
  return m;
}

// Alle Felder, die als „aus Akten“ markiert sind oder deren Ort „akten“ ist und die noch leer sind.
function akteneintraege(g, buch) {
  const liste = [];
  for (const k of sichtbareKapitel(g, buch)) {
    for (const f of sichtbareFelder(k, buch)) {
      if (f.aus) continue;
      const st = feldStatus(g, buch, k.id, f);
      if (st === 'aus_akten' || (f.ort === 'akten' && st === 'leer')) liste.push({ kapitel: k, feld: f, status: st });
    }
  }
  return liste;
}

// ---------- Vorschläge ----------
function vorschlagAusTeilbauwerken(g, buch, feld) {
  if (feld.vorschlagAus !== 'teilbauwerke') return '';
  const erlaubt = feld.vorschlagTeilbauwerke ? new Set(feld.vorschlagTeilbauwerke) : null;
  const gewaehlt = new Set(buch.teilbauwerke || []);
  const namen = (g.teilbauwerke || [])
    .filter((t) => gewaehlt.has(t.id) && (!erlaubt || erlaubt.has(t.id)))
    .map((t) => t.label);
  return namen.join(', ');
}

// ---------- Neues Beckenbuch ----------
function neueId() {
  const zufall = Math.random().toString(36).slice(2, 8);
  return `bb-${Date.now().toString(36)}-${zufall}`;
}

function neueZeilenId() {
  return `z-${Math.random().toString(36).slice(2, 10)}`;
}

function neuesBeckenbuch(g, stammdaten, angaben, jetzt = new Date().toISOString()) {
  const buch = {
    id: neueId(),
    vorlage: { name: g.vorlage, version: g.version, testdaten: !!g.testdaten },
    stand: 'in_arbeit',
    teilbauwerke: [...(angaben.teilbauwerke || [])],
    freieTeilbauwerke: (angaben.freieTeilbauwerke || []).filter((t) => t && t.trim()),
    zugeschaltet: [],
    werte: {},
    notizen: {},
    angelegt: jetzt,
    geaendert: jetzt,
    gesichert: null,
    versendet: null,
  };
  const setze = (key, wert) => { buch.werte[key] = { wert, status: null, geaendert: jetzt }; };
  const deck = g.kapitel.find((k) => k.id === 'DECK');
  const hatFeld = (id) => !!deck && (deck.felder || []).some((f) => f.id === id);
  if (angaben.name && hatFeld('name')) setze('DECK.name', angaben.name);
  if (angaben.bauwerksnr && hatFeld('bauwerksnr')) setze('DECK.bauwerksnr', angaben.bauwerksnr);
  // Rückfall: Hat die Gliederung (z. B. die Test-Gliederung) kein Deckblattfeld dafür,
  // merkt sich das Beckenbuch Name und Bauwerksnummer selbst, damit nichts verloren geht.
  buch.kopf = {
    name: !hatFeld('name') && angaben.name ? angaben.name.trim() : '',
    bauwerksnr: !hatFeld('bauwerksnr') && angaben.bauwerksnr ? angaben.bauwerksnr.trim() : '',
  };
  // Stammdaten übernehmen (Kopie – später im Beckenbuch änderbar)
  for (const k of g.kapitel) {
    for (const f of k.felder || []) {
      if (!f.stammdaten) continue;
      const w = stammdaten ? stammdaten[f.stammdaten] : undefined;
      if (w === undefined || w === null || w === '') continue;
      if (f.art === 'tabelle') {
        if (Array.isArray(w) && w.length) setze(feldKey(k.id, f.id), w.map((z) => ({ ...z, id: neueZeilenId() })));
      } else setze(feldKey(k.id, f.id), w);
    }
  }
  // Vorschlagszeilen für Tabellen anlegen
  for (const k of g.kapitel) {
    for (const f of k.felder || []) {
      const key = feldKey(k.id, f.id);
      if (f.art === 'tabelle' && Array.isArray(f.vorschlagZeilen) && !buch.werte[key]) {
        setze(key, f.vorschlagZeilen.map((z) => ({ ...z, id: neueZeilenId(), _vorschlag: true })));
      }
    }
  }
  return buch;
}

function buchName(buch) {
  const e = buch.werte && buch.werte['DECK.name'];
  return (e && e.wert) || (buch.kopf && buch.kopf.name) || 'Ohne Namen';
}

function buchBauwerksnr(buch) {
  const e = buch.werte && buch.werte['DECK.bauwerksnr'];
  return (e && e.wert) || (buch.kopf && buch.kopf.bauwerksnr) || '';
}

// Hinweis „nicht gesichert“: geändert nach letzter Sicherung bzw. letztem Versand.
function brauchtSicherung(buch) {
  const letzte = [buch.gesichert, buch.versendet].filter(Boolean).sort().pop();
  return !letzte || letzte < buch.geaendert;
}

return { STATUS, HAND_STATUS, FELDARTEN, BUCH_STAND, feldKey, pruefeGliederung, istSichtbar, sichtbareKapitel, sichtbareFelder, istLeer, zeileHatInhalt, wertVon, feldStatus, kapitelFortschritt, mindestumfang, feldIndex, akteneintraege, vorschlagAusTeilbauwerken, neueId, neueZeilenId, neuesBeckenbuch, buchName, buchBauwerksnr, brauchtSicherung };
})();

const Modul_ui = await (async () => {
// Kleine Hilfsfunktionen für die Oberfläche.

// h('button', { class: 'gross', onclick: fn }, 'Text') erzeugt ein Element.
function h(tag, attrs = {}, ...kinder) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kind of kinder.flat(Infinity)) {
    if (kind === undefined || kind === null || kind === false) continue;
    el.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return el;
}

function leere(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

let toastTimer = null;
function meldung(text, art = 'info') {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = `toast sichtbar ${art}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, art === 'fehler' ? 6000 : 2500);
}

// Rückfrage mit großen Schaltflächen. Gibt true/false zurück.
function bestaetigen(text, jaText = 'Ja', neinText = 'Abbrechen', gefaehrlich = false) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: 'dialog' },
      h('p', {}, text),
      h('div', { class: 'dialog-knoepfe' },
        h('button', { class: 'knopf', onclick: () => { dlg.close(); resolve(false); } }, neinText),
        h('button', { class: gefaehrlich ? 'knopf gefahr' : 'knopf primaer', onclick: () => { dlg.close(); resolve(true); } }, jaText),
      ),
    );
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg);
    dlg.showModal();
  });
}

function datumDE(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

// Textfeld wächst mit dem Inhalt mit.
function mitwachsen(textarea) {
  const anpassen = () => { textarea.style.height = 'auto'; textarea.style.height = `${textarea.scrollHeight + 2}px`; };
  textarea.addEventListener('input', anpassen);
  requestAnimationFrame(anpassen);
  return textarea;
}

// Feld, zu dem nach dem Wechsel zurück ins Kapitel gescrollt wird (z. B. nach dem Zeichnen).
const sprungziel = { key: null };

return { h, leere, meldung, bestaetigen, datumDE, mitwachsen, sprungziel };
})();

// ===== js/bilder.js =====
const Modul_bilder = await (async () => {
// Bilder verkleinern und laden. Fotos werden beim Aufnehmen auf eine handliche Größe gebracht,
// damit der Speicher des Handys nicht vollläuft. Für die Ausgabe (Etappe 6) wird nochmals verkleinert.

const FOTO_MAX_KANTE = 2000;   // Pixel der längeren Seite im Speicher
const FOTO_QUALITAET = 0.85;
const VORSCHAU_MAX_KANTE = 360;

// Zielgröße bei gleichem Seitenverhältnis; kleinere Bilder werden nicht vergrößert.
function zielgroesse(breite, hoehe, maxKante) {
  const lang = Math.max(breite, hoehe);
  if (lang <= maxKante) return { breite, hoehe };
  const f = maxKante / lang;
  return { breite: Math.max(1, Math.round(breite * f)), hoehe: Math.max(1, Math.round(hoehe * f)) };
}

// Datei (Kamera/Galerie) → Bild mit richtiger Drehung (Chrome beachtet die EXIF-Ausrichtung).
async function ladeBild(blob) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch { /* Fallback unten */ }
  }
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function canvasZuBlob(canvas, typ = 'image/jpeg', qualitaet = FOTO_QUALITAET) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Bild konnte nicht erzeugt werden.'))), typ, qualitaet);
  });
}

// Liefert { blob, vorschau, breite, hoehe }.
async function verkleinere(datei, maxKante = FOTO_MAX_KANTE) {
  const bild = await ladeBild(datei);
  const bw = bild.width, bh = bild.height;
  const z = zielgroesse(bw, bh, maxKante);
  const c = document.createElement('canvas');
  c.width = z.breite; c.height = z.hoehe;
  c.getContext('2d').drawImage(bild, 0, 0, z.breite, z.hoehe);
  const blob = await canvasZuBlob(c);
  const v = zielgroesse(z.breite, z.hoehe, VORSCHAU_MAX_KANTE);
  const cv = document.createElement('canvas');
  cv.width = v.breite; cv.height = v.hoehe;
  cv.getContext('2d').drawImage(c, 0, 0, v.breite, v.hoehe);
  const vorschau = await canvasZuBlob(cv, 'image/jpeg', 0.8);
  if (bild.close) bild.close();
  return { blob, vorschau, breite: z.breite, hoehe: z.hoehe };
}

// Objekt-URLs für Vorschaubilder; werden beim Bildschirmwechsel freigegeben.
const urls = new Set();
function bildUrl(blob) {
  const u = URL.createObjectURL(blob);
  urls.add(u);
  return u;
}
function urlsFreigeben() {
  for (const u of urls) URL.revokeObjectURL(u);
  urls.clear();
}

function groesseText(bytes) {
  if (bytes < 1e6) return `${Math.round(bytes / 1e3)} kB`;
  return `${(bytes / 1e6).toFixed(1).replace('.', ',')} MB`;
}

return { FOTO_MAX_KANTE, FOTO_QUALITAET, VORSCHAU_MAX_KANTE, zielgroesse, ladeBild, canvasZuBlob, verkleinere, bildUrl, urlsFreigeben, groesseText };
})();

// ===== js/fotos.js =====
const Modul_fotos = await (async () => {
// Fotos: aufnehmen oder aus der Galerie wählen, Bildunterschrift, fortlaufende Nummer, Zeit, Standort (auf Wunsch).
// Ein Foto ist ein Datensatz im Speicher „fotos“:
// { id, buchId, feldKey, nr, blob, vorschau, breite, hoehe, unterschrift, aufgenommen, quelle, standort }
// Das Feld im Beckenbuch enthält nur die Liste der Foto-IDs.
const db = Modul_db;
const { h, leere, meldung, bestaetigen, datumDE } = Modul_ui;
const { verkleinere, bildUrl, groesseText } = Modul_bilder;
function neueFotoId() {
  return `f-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

// Standort einmalig abfragen. Liefert { lat, lon, genauigkeit, zeit } oder null.
function standortAbfragen(zeitlimitMs = 15000) {
  return new Promise((resolve) => {
    if (!('geolocation' in navigator)) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({
        lat: Math.round(p.coords.latitude * 1e6) / 1e6,
        lon: Math.round(p.coords.longitude * 1e6) / 1e6,
        genauigkeit: Math.round(p.coords.accuracy),
        zeit: new Date(p.timestamp).toISOString(),
      }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: zeitlimitMs, maximumAge: 30000 },
    );
  });
}

function standortText(s) {
  if (!s) return 'ohne Standort';
  return `${String(s.lat).replace('.', ',')} / ${String(s.lon).replace('.', ',')} (± ${s.genauigkeit} m)`;
}

// Nimmt Dateien entgegen, verkleinert, speichert. Liefert die neuen Foto-Datensätze.
// kontext: { buch, aendern(buch), standortAn }
async function fotosAufnehmen(dateien, kontext, feldKey, quelle) {
  const neu = [];
  for (const datei of dateien) {
    if (!datei.type.startsWith('image/')) { meldung(`${datei.name}: kein Bild`, 'fehler'); continue; }
    const v = await verkleinere(datei);
    kontext.buch.fotoZaehler = (kontext.buch.fotoZaehler || 0) + 1;
    const foto = {
      id: neueFotoId(),
      buchId: kontext.buch.id,
      feldKey,
      nr: kontext.buch.fotoZaehler,
      blob: v.blob,
      vorschau: v.vorschau,
      breite: v.breite,
      hoehe: v.hoehe,
      unterschrift: '',
      // Kamera: jetzt. Galerie: Änderungsdatum der Datei (meist Aufnahmezeit).
      aufgenommen: new Date(quelle === 'galerie' && datei.lastModified ? datei.lastModified : Date.now()).toISOString(),
      quelle,
      standort: null,
    };
    // Erst das Foto dauerhaft speichern, dann im Beckenbuch eintragen.
    await db.speichere('fotos', foto);
    neu.push(foto);
  }
  if (neu.length && kontext.standortAn) {
    // Standort im Hintergrund ergänzen – das Foto ist schon gespeichert.
    standortAbfragen().then((s) => {
      for (const f of neu) { f.standort = s; db.speichere('fotos', f); }
      if (!s) meldung('Standort konnte nicht ermittelt werden.');
    });
  }
  return neu;
}

async function ladeFotos(ids) {
  const r = [];
  for (const id of ids || []) {
    const f = await db.lese('fotos', id);
    if (f) r.push(f);
  }
  return r;
}

// Bedienelement für ein Fotofeld (oder die Fotos einer Tabellenzeile).
// ids: aktuelle Liste, setzeIds(neueListe): speichert im Beckenbuch.
function fotoFeld({ kontext, feldKey, ids, setzeIds, nurAnzeigen = false }) {
  const box = h('div', { class: 'fotofeld' });
  const raster = h('div', { class: 'foto-raster' });
  let liste = [...(ids || [])];

  const zeichne = async () => {
    const fotos = await ladeFotos(liste);
    leere(raster);
    if (!fotos.length) raster.append(h('p', { class: 'leer' }, nurAnzeigen ? '(noch kein Foto)' : 'Noch kein Foto.'));
    for (const f of fotos) raster.append(fotoKarte(f, nurAnzeigen, async () => {
      liste = liste.filter((x) => x !== f.id);
      setzeIds(liste);
      await db.loesche('fotos', f.id);
      zeichne();
    }));
  };

  box.append(raster);
  if (!nurAnzeigen) {
    const verarbeite = async (ev, quelle) => {
      const dateien = [...ev.target.files];
      ev.target.value = '';
      if (!dateien.length) return;
      meldung(dateien.length > 1 ? `${dateien.length} Fotos werden gespeichert …` : 'Foto wird gespeichert …');
      try {
        const neu = await fotosAufnehmen(dateien, kontext, feldKey, quelle);
        liste = [...liste, ...neu.map((f) => f.id)];
        setzeIds(liste);
        await zeichne();
        if (neu.length) meldung(neu.length > 1 ? `${neu.length} Fotos gespeichert.` : `Foto ${neu[0].nr} gespeichert.`);
      } catch (e) {
        meldung(`Foto konnte nicht gespeichert werden: ${e.message}`, 'fehler');
      }
    };
    const kamera = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'versteckt', onchange: (ev) => verarbeite(ev, 'kamera') });
    const galerie = h('input', { type: 'file', accept: 'image/*', multiple: true, class: 'versteckt', onchange: (ev) => verarbeite(ev, 'galerie') });
    box.append(kamera, galerie, h('div', { class: 'knopfzeile' },
      h('button', { class: 'knopf primaer', onclick: () => kamera.click() }, '📷 Foto aufnehmen'),
      h('button', { class: 'knopf', onclick: () => galerie.click() }, 'Aus Galerie')));
  }
  zeichne();
  return box;
}

function fotoKarte(f, nurAnzeigen, loeschen) {
  const karte = h('figure', { class: 'foto-karte' });
  const img = h('img', { src: bildUrl(f.vorschau || f.blob), alt: f.unterschrift || `Foto ${f.nr}`, onclick: () => fotoGross(f, nurAnzeigen, loeschen) });
  karte.append(h('div', { class: 'foto-nr' }, `Foto ${f.nr}`), img);
  if (nurAnzeigen) {
    if (f.unterschrift) karte.append(h('figcaption', {}, f.unterschrift));
  } else {
    karte.append(h('input', {
      type: 'text', class: 'unterschrift', placeholder: 'Bildunterschrift', value: f.unterschrift || '', autocomplete: 'off',
      oninput: (ev) => { f.unterschrift = ev.target.value; db.speichere('fotos', f); },
    }));
  }
  return karte;
}

function fotoGross(f, nurAnzeigen, loeschen) {
  const dlg = h('dialog', { class: 'dialog foto-dialog' },
    h('img', { src: bildUrl(f.blob), alt: f.unterschrift || `Foto ${f.nr}` }),
    h('p', {}, h('strong', {}, `Foto ${f.nr}`), f.unterschrift ? ` – ${f.unterschrift}` : ''),
    h('p', { class: 'feld-hinweis' }, `${datumDE(f.aufgenommen)} · ${f.quelle === 'galerie' ? 'aus Galerie' : 'Kamera'} · ${standortText(f.standort)} · ${f.breite}×${f.hoehe} px, ${groesseText(f.blob.size)}`),
    h('div', { class: 'dialog-knoepfe' },

return { neueFotoId, standortAbfragen, standortText, fotosAufnehmen, ladeFotos, fotoFeld };

// ===== js/skizzenlogik.js =====
const Modul_skizzenlogik = await (async () => {
// Skizzen: Datenmodell, Zeichnen, Trefferprüfung, Abgleich der Eingriffsstellen.
// Ohne Bildschirmelemente (außer dem übergebenen Zeichenkontext) – deshalb automatisch testbar.
//
// Eine Skizze ist ein Datensatz im Speicher „skizzen“:
// { id, buchId, feldKey, breite, hoehe, grundlage: null | { blob, breite, hoehe },
//   elemente: [ {typ:'strich', farbe, dicke, punkte:[[x,y],…]} | {typ:'marke', nr, x, y} | {typ:'text', text, x, y, farbe} ],
//   angelegt, geaendert, bild: Blob (fertig gezeichnet, für Vorschau und Ausgabe) }
// Koordinaten sind Pixel der Skizze (breite × hoehe), unabhängig von der Bildschirmgröße.

const LEER_BREITE = 1600;
const LEER_HOEHE = 1200;
const FARBEN = { schwarz: '#111111', rot: '#c4001d', blau: '#0047b3' };
const FUSS_HOEHE = 56; // Leiste unter der Skizze in der fertigen Grafik

// Größen richten sich nach der längeren Seite der Skizze, damit Marken und Text auf
// leerer Fläche und auf Fotos gleich groß wirken (auf dem Handy ca. 13 Pixel Markenradius).
function masse(skizze) {
  const l = Math.max(skizze.breite, skizze.hoehe);
  return {
    radius: Math.round(l * 0.04),
    text: Math.round(l * 0.04),
    duenn: Math.max(2, Math.round(l * 0.005)),
    dick: Math.max(4, Math.round(l * 0.013)),
  };
}

function neueSkizze({ id, buchId, feldKey, grundlage = null, jetzt = new Date().toISOString() }) {
  const breite = grundlage ? grundlage.breite : LEER_BREITE;
  const hoehe = grundlage ? grundlage.hoehe : LEER_HOEHE;
  return { id, buchId, feldKey, breite, hoehe, grundlage, elemente: [], angelegt: jetzt, geaendert: jetzt, bild: null };
}

// Kleinste freie Nummer (Lücken werden zuerst gefüllt). `belegt` sind Nummern auch aus anderen Skizzen desselben Feldes.
function naechsteMarkenNr(belegt) {
  const set = new Set(belegt.map(Number));
  let n = 1;
  while (set.has(n)) n++;
  return n;
}

function markenNummern(skizzen) {
  const nrn = [];
  for (const s of skizzen) for (const e of s.elemente || []) if (e.typ === 'marke') nrn.push(e.nr);
  return nrn.sort((a, b) => a - b);
}

// ---------- Eingriffsstellen ----------
// Vergleicht die Marken der Skizze mit den Zeilen der Tabelle (Spalte „nr“).
function eingriffsAbgleich(markenNrn, zeilen) {
  const marken = new Set(markenNrn.map(Number));
  const zeilenNrn = new Set();
  for (const z of zeilen || []) {
    if (z._vorschlag) continue;
    const n = Number(String(z.nr ?? '').trim().replace(',', '.'));
    if (Number.isInteger(n) && n > 0) zeilenNrn.add(n);
  }
  return {
    ohneZeile: [...marken].filter((n) => !zeilenNrn.has(n)).sort((a, b) => a - b),
    ohneMarke: [...zeilenNrn].filter((n) => !marken.has(n)).sort((a, b) => a - b),
  };
}

// Legt für Marken ohne Tabellenzeile eine leere Zeile an. Vorhandene Zeilen bleiben unverändert.
function zeilenFuerMarken(markenNrn, zeilen, neueZeilenId) {
  const { ohneZeile } = eingriffsAbgleich(markenNrn, zeilen);
  const neu = [...(zeilen || [])];
  for (const n of ohneZeile) neu.push({ id: neueZeilenId(), nr: String(n) });
  return neu.sort((a, b) => (Number(a.nr) || 1e9) - (Number(b.nr) || 1e9));
}

// Entfernt die Zeile zu einer gelöschten Marke nur dann, wenn sie außer der Nummer nichts enthält.
function zeileZuMarkeEntfernen(nr, zeilen) {
  return (zeilen || []).filter((z) => {
    if (String(z.nr) !== String(nr)) return true;
    return Object.entries(z).some(([k, v]) => !['id', 'nr', '_vorschlag'].includes(k) && v !== undefined && String(v).trim() !== '');
  });
}

// ---------- Trefferprüfung (Löschen, Verschieben) ----------
function abstandZuStrecke(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function textBreite(text, groesse) {
  return String(text).length * groesse * 0.58; // Schätzung, reicht für die Trefferprüfung
}

// Index des obersten Elements an Punkt (x,y) oder -1. `toleranz` in Skizzenpixeln.
// m: Ergebnis von masse(skizze).
function elementBei(elemente, x, y, m, toleranz = 24, nurVerschiebbar = false) {
  for (let i = elemente.length - 1; i >= 0; i--) {
    const e = elemente[i];
    if (e.typ === 'marke' && Math.hypot(x - e.x, y - e.y) <= m.radius + toleranz) return i;
    if (e.typ === 'text') {
      const b = textBreite(e.text, m.text);
      if (x >= e.x - toleranz && x <= e.x + b + toleranz && y >= e.y - m.text - toleranz && y <= e.y + toleranz) return i;
    }
    if (e.typ === 'strich' && !nurVerschiebbar) {
      const p = e.punkte;
      if (p.length === 1 && Math.hypot(x - p[0][0], y - p[0][1]) <= toleranz + e.dicke) return i;
      for (let j = 1; j < p.length; j++) {
        if (abstandZuStrecke(x, y, p[j - 1][0], p[j - 1][1], p[j][0], p[j][1]) <= toleranz + e.dicke / 2) return i;
      }
    }
  }
  return -1;
}

// Punkte eines Strichs ausdünnen: Punkte näher als `min` Pixel am Vorgänger entfallen (spart Speicher).
function duenneAus(punkte, min = 2) {
  if (punkte.length <= 2) return punkte.map((p) => [Math.round(p[0]), Math.round(p[1])]);
  const r = [punkte[0]];
  for (let i = 1; i < punkte.length - 1; i++) {
    const l = r[r.length - 1];
    if (Math.hypot(punkte[i][0] - l[0], punkte[i][1] - l[1]) >= min) r.push(punkte[i]);
  }
  r.push(punkte[punkte.length - 1]);
  return r.map((p) => [Math.round(p[0]), Math.round(p[1])]);
}

// ---------- Zeichnen ----------
// ctx: 2D-Kontext, bereits so skaliert, dass 1 Einheit = 1 Skizzenpixel.
// hintergrund: geladenes Bild (ImageBitmap/HTMLImageElement) oder null.
function zeichne(ctx, skizze, hintergrund, { raster = false, auswahl = -1 } = {}) {
  const { breite, hoehe } = skizze;
  const m = masse(skizze);
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, breite, hoehe);
  if (hintergrund) ctx.drawImage(hintergrund, 0, 0, breite, hoehe);
  if (raster && !hintergrund) {
    // Nur Zeichenhilfe im Editor, erscheint nicht in der fertigen Skizze.
    ctx.strokeStyle = '#e3e8ee';
    ctx.lineWidth = 2;
    for (let x = 100; x < breite; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hoehe); ctx.stroke(); }
    for (let y = 100; y < hoehe; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(breite, y); ctx.stroke(); }
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Reihenfolge: Striche unten, darüber Texte, ganz oben die Marken – damit Nummern immer lesbar bleiben.
  const reihe = (e) => (e.typ === 'strich' ? 0 : e.typ === 'text' ? 1 : 2);
  const sortiert = skizze.elemente.map((e, i) => [e, i]).sort((a, b) => reihe(a[0]) - reihe(b[0]) || a[1] - b[1]);
  sortiert.forEach(([e, i]) => {
    if (e.typ === 'strich') {
      ctx.strokeStyle = e.farbe;
      ctx.fillStyle = e.farbe;
      ctx.lineWidth = e.dicke;
      const p = e.punkte;
      if (p.length === 1) {
        ctx.beginPath(); ctx.arc(p[0][0], p[0][1], e.dicke / 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
        for (let j = 1; j < p.length; j++) ctx.lineTo(p[j][0], p[j][1]);
        ctx.stroke();
      }
    } else if (e.typ === 'marke') {
      ctx.beginPath(); ctx.arc(e.x, e.y, m.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = Math.max(3, m.radius * 0.18); ctx.strokeStyle = FARBEN.rot; ctx.stroke();
      ctx.fillStyle = FARBEN.rot;
      ctx.font = `bold ${Math.round(m.radius * 1.15)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(e.nr), e.x, e.y + 2);
    } else if (e.typ === 'text') {
      ctx.font = `600 ${m.text}px system-ui, sans-serif`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      // weißer Rand, damit Text auch auf Fotos lesbar ist
      ctx.lineWidth = Math.max(4, m.text * 0.2); ctx.strokeStyle = '#ffffff'; ctx.strokeText(e.text, e.x, e.y);
      ctx.fillStyle = e.farbe || FARBEN.schwarz; ctx.fillText(e.text, e.x, e.y);
    }
    if (i === auswahl) {
      ctx.save();
      ctx.setLineDash([12, 8]); ctx.lineWidth = 4; ctx.strokeStyle = '#ffb000';
      if (e.typ === 'marke') { ctx.beginPath(); ctx.arc(e.x, e.y, m.radius * 1.4, 0, Math.PI * 2); ctx.stroke(); }
      if (e.typ === 'text') ctx.strokeRect(e.x - 10, e.y - m.text - 10, textBreite(e.text, m.text) + 20, m.text + 24);
      ctx.restore();
    }
  });
  ctx.restore();
}

// Fußleiste der fertigen Grafik: Kennzeichnung als Handskizze mit Datum und Erfasser.
function fussText(skizze, erfasser, datumText) {
  const teile = ['Handskizze, nicht maßstäblich'];
  if (datumText) teile.push(datumText);
  if (erfasser) teile.push(`Erfasser: ${erfasser}`);
  return teile.join(' · ');
}

function verschiebe(element, dx, dy) {
  if (element.typ === 'marke' || element.typ === 'text') {
    element.x = Math.round(element.x + dx);
    element.y = Math.round(element.y + dy);
  }
}

// Hält einen Punkt innerhalb der Zeichenfläche.
function begrenze(x, y, skizze) {
  return [Math.max(0, Math.min(skizze.breite, x)), Math.max(0, Math.min(skizze.hoehe, y))];
}

return { LEER_BREITE, LEER_HOEHE, FARBEN, FUSS_HOEHE, masse, neueSkizze, naechsteMarkenNr, markenNummern, eingriffsAbgleich, zeilenFuerMarken, zeileZuMarkeEntfernen, textBreite, elementBei, duenneAus, zeichne, fussText, verschiebe, begrenze };
})();

// ===== js/skizzen.js =====
const Modul_skizzen = await (async () => {
// Skizzen zeichnen: leere Fläche oder Foto (Handskizze, Plan, Anlage) als Grundlage,
// Stift, Text, nummerierte Marken für Eingriffsstellen, Verschieben, Löschen, Rückgängig.
// Jede Änderung wird sofort gespeichert.
const db = Modul_db;
const S = Modul_skizzenlogik;
const { h, leere, meldung, bestaetigen, sprungziel } = Modul_ui;
const { verkleinere, ladeBild, canvasZuBlob, bildUrl } = Modul_bilder;
const { feldIndex, feldKey, neueZeilenId } = Modul_gliederung;
function neueSkizzenId() {
  return `s-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

async function ladeSkizzen(ids) {
  const r = [];
  for (const id of ids || []) {
    const s = await db.lese('skizzen', id);
    if (s) r.push(s);
  }
  return r;
}

// Fertige Grafik (mit Fußleiste) erzeugen und in der Skizze ablegen.
async function bildErzeugen(skizze, hintergrund) {
  if (skizze.grundlage && !hintergrund) hintergrund = await ladeBild(skizze.grundlage.blob);
  const c = document.createElement('canvas');
  c.width = skizze.breite;
  c.height = skizze.hoehe + S.FUSS_HOEHE;
  const ctx = c.getContext('2d');
  S.zeichne(ctx, skizze, hintergrund, {});
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, skizze.hoehe, skizze.breite, S.FUSS_HOEHE);
  ctx.fillStyle = '#333333';
  ctx.font = '26px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const datum = new Date(skizze.angelegt).toLocaleDateString('de-DE');
  ctx.fillText(S.fussText(skizze, skizze.erfasser, datum), 16, skizze.hoehe + S.FUSS_HOEHE / 2);
  skizze.bild = await canvasZuBlob(c, skizze.grundlage ? 'image/jpeg' : 'image/png', 0.88);
  skizze.bildStand = skizze.geaendert;
  return skizze.bild;
}

// Vorschau mit aktuellem Bild; erzeugt es neu, falls es veraltet ist (z. B. nach Absturz).
async function aktuellesBild(s) {
  if (!s.bild || s.bildStand !== s.geaendert) {
    await bildErzeugen(s);
    await db.speichere('skizzen', s);
  }
  return s.bild;
}

// ---------- Feld im Kapitel ----------
// kontext: { buch, aendern(buch), erfasser }
function skizzenFeld({ kontext, kap, feld, ids, setzeIds, nurAnzeigen = false, hinweisMarken = '' }) {
  const box = h('div', { class: 'skizzenfeld' });
  const raster = h('div', { class: 'foto-raster' });
  box.append(raster);
  const key = feldKey(kap.id, feld.id);

  (async () => {
    const skizzen = await ladeSkizzen(ids);
    leere(raster);
    if (!skizzen.length) raster.append(h('p', { class: 'leer' }, nurAnzeigen ? '(noch keine Skizze)' : 'Noch keine Skizze.'));
    for (const s of skizzen) {
      const bild = await aktuellesBild(s);
      const marken = S.markenNummern([s]);
      const inhalt = [
        h('img', { src: bildUrl(bild), alt: 'Skizze', class: 'skizzen-vorschau' }),
        h('div', { class: 'foto-nr' }, marken.length ? `Marken: ${marken.join(', ')}` : (s.grundlage ? 'auf Foto' : 'Skizze')),
      ];
      raster.append(nurAnzeigen
        ? h('figure', { class: 'foto-karte' }, ...inhalt)
        : h('a', { class: 'foto-karte', href: `#/buch/${encodeURIComponent(kontext.buch.id)}/skizze/${encodeURIComponent(s.id)}` }, ...inhalt, h('span', { class: 'knopf klein' }, 'Bearbeiten')));
    }
  })();

  if (nurAnzeigen) return box;
  if (hinweisMarken) box.append(h('p', { class: 'feld-hinweis' }, hinweisMarken));

  const anlegen = async (grundlage) => {
    const s = S.neueSkizze({ id: neueSkizzenId(), buchId: kontext.buch.id, feldKey: key, grundlage });
    s.erfasser = kontext.erfasser || '';
    await bildErzeugen(s);
    await db.speichere('skizzen', s);
    await db.allesGespeichert();
    setzeIds([...(ids || []), s.id]);
    await db.allesGespeichert();
    location.hash = `#/buch/${encodeURIComponent(kontext.buch.id)}/skizze/${encodeURIComponent(s.id)}`;
  };
  const mitFoto = async (ev) => {
    const datei = ev.target.files[0];
    ev.target.value = '';
    if (!datei) return;
    try {
      const v = await verkleinere(datei);
      await anlegen({ blob: v.blob, breite: v.breite, hoehe: v.hoehe });
    } catch (e) {
      meldung(`Foto konnte nicht geladen werden: ${e.message}`, 'fehler');
    }
  };
  const kamera = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'versteckt', onchange: mitFoto });
  const galerie = h('input', { type: 'file', accept: 'image/*', class: 'versteckt', onchange: mitFoto });
  box.append(kamera, galerie,
    h('button', { class: 'knopf primaer breit', onclick: () => anlegen(null) }, '✏️ Neue Skizze (leere Fläche)'),
    h('div', { class: 'knopfzeile' },
      h('button', { class: 'knopf', onclick: () => kamera.click() }, '📷 Handskizze/Plan fotografieren'),
      h('button', { class: 'knopf', onclick: () => galerie.click() }, 'Foto aus Galerie')),
    h('p', { class: 'feld-hinweis' }, 'Auf dem Foto kann anschließend gezeichnet und markiert werden.'));
  return box;
}

// ---------- Zeichenbildschirm ----------
// umgebung: { app, kopf, fuss, ladeBuch, gliederungFuer, aendern }
async function bildschirmSkizze(umgebung, buchId, skizzeId) {
  const { app, kopf, fuss, ladeBuch, gliederungFuer, aendern } = umgebung;
  const buch = await ladeBuch(buchId);
  const { g } = await gliederungFuer(buch);
  const skizze = await db.lese('skizzen', skizzeId);
  if (!skizze) throw new Error('Diese Skizze gibt es nicht (mehr).');
  const ort = feldIndex(g).get(skizze.feldKey);
  if (!ort) throw new Error(`Das Feld ${skizze.feldKey} gibt es in der Vorlage nicht.`);
  const { kapitel: kap, feld } = ort;
  const zurueck = `#/buch/${encodeURIComponent(buch.id)}/kapitel/${encodeURIComponent(kap.id)}`;
  sprungziel.key = skizze.feldKey; // nach der Rückkehr zum Feld scrollen
  const tabellenKey = feld.marken || null; // z. B. "A4_1.eingriffsstellen"
  const tabellenFeld = tabellenKey ? feldIndex(g).get(tabellenKey)?.feld : null;

  const hintergrund = skizze.grundlage ? await ladeBild(skizze.grundlage.blob) : null;
  // Marken der anderen Skizzen desselben Feldes – Nummern bleiben über alle Skizzen eindeutig.
  const andereIds = ((buch.werte[skizze.feldKey] || {}).wert || []).filter((id) => id !== skizze.id);
  const andereMarken = S.markenNummern(await ladeSkizzen(andereIds));

  let modus = 'stift';
  let farbe = S.FARBEN.schwarz;
  const m = S.masse(skizze);
  let dicke = m.duenn;
  let auswahl = -1;
  const rueck = [];
  const vor = [];

  const canvas = h('canvas', { class: 'zeichenflaeche', width: skizze.breite, height: skizze.hoehe });
  const ctx = canvas.getContext('2d');
  let geplant = false;
  let laufenderStrich = null;
  const neuZeichnen = () => {
    if (geplant) return;
    geplant = true;
    requestAnimationFrame(() => {
      geplant = false;
      const anzeigen = laufenderStrich ? { ...skizze, elemente: [...skizze.elemente, laufenderStrich] } : skizze;
      S.zeichne(ctx, anzeigen, hintergrund, { raster: true, auswahl });
    });
  };

  // ----- Speichern -----
  let bildTimer = null;
  const speichern = () => {
    skizze.geaendert = new Date().toISOString();
    db.speichere('skizzen', skizze);
    clearTimeout(bildTimer);
    bildTimer = setTimeout(async () => { await bildErzeugen(skizze, hintergrund); db.speichere('skizzen', skizze); }, 800);
  };
  const tabelle = () => {
    if (!tabellenKey) return null;
    if (!buch.werte[tabellenKey]) buch.werte[tabellenKey] = { wert: [], status: null, geaendert: null };
    return buch.werte[tabellenKey];
  };
  const alleMarken = () => [...andereMarken, ...S.markenNummern([skizze])];
  const tabelleAbgleichen = () => {
    const t = tabelle();
    if (!t) return;
    const alt = JSON.stringify(t.wert || []);
    t.wert = S.zeilenFuerMarken(alleMarken(), t.wert || [], neueZeilenId);
    if (JSON.stringify(t.wert) !== alt) { t.status = null; t.geaendert = new Date().toISOString(); aendern(buch); }
  };
  const merke = () => { rueck.push(JSON.stringify(skizze.elemente)); if (rueck.length > 100) rueck.shift(); vor.length = 0; };
  const geaendert = () => { speichern(); tabelleAbgleichen(); neuZeichnen(); zeichneMarkenListe(); zeichneWerkzeug(); };

  // ----- Eingabe auf der Zeichenfläche -----
  const punkt = (ev) => {
    const r = canvas.getBoundingClientRect();
    return S.begrenze((ev.clientX - r.left) * (skizze.breite / r.width), (ev.clientY - r.top) * (skizze.hoehe / r.height), skizze);
  };
  const toleranz = () => 14 * (skizze.breite / canvas.getBoundingClientRect().width); // ca. 14 Bildschirmpixel
  let ziehen = null;

  canvas.addEventListener('pointerdown', async (ev) => {
    ev.preventDefault();
    const [x, y] = punkt(ev);
    if (modus === 'stift') {
      canvas.setPointerCapture(ev.pointerId);
      laufenderStrich = { typ: 'strich', farbe, dicke, punkte: [[x, y]] };
      neuZeichnen();
    } else if (modus === 'marke') {
      merke();
      skizze.elemente.push({ typ: 'marke', nr: S.naechsteMarkenNr(alleMarken()), x: Math.round(x), y: Math.round(y) });
      geaendert();
    } else if (modus === 'text') {
      const text = await textAbfragen();
      if (!text) return;
      merke();

// ===== js/sammeldiktat.js =====
const Modul_sammeldiktat = await (async () => {
// Sammeldiktat je Kapitel: freier Text → Vorschläge, welcher Wert in welches Feld gehört.
// Ohne KI-Dienst: Zuordnung über Stichwörter und Wörter der Feldnamen. Ich bestätige oder korrigiere jeden Vorschlag;
// was sich nicht zuordnen lässt, wird als Notiz zum Kapitel vorgeschlagen.
const { bewerteMassEingabe } = Modul_masse;
const FUELLWOERTER = new Set(['der', 'die', 'das', 'des', 'dem', 'den', 'und', 'oder', 'von', 'vom', 'für', 'mit', 'zur', 'zum', 'nach',
  'sowie', 'bei', 'als', 'aus', 'ggf', 'z.b', 'vorhandene', 'vorhandener', 'angaben', 'angabe', 'optional', 'hinweise', 'test']);

function norm(s) {
  return String(s || '').toLowerCase().replace(/[()„“"]/g, ' ').replace(/\s+/g, ' ').trim();
}

// Stichwörter eines Feldes oder einer Tabellenspalte: ausdrückliche + Wörter des Namens (ab 4 Buchstaben).
function stichwoerter(feld) {
  const eigene = (feld.stichwoerter || []).map(norm);
  const ausLabel = norm(feld.label).split(/[\s/,.:;-]+/).filter((w) => w.length >= 4 && !FUELLWOERTER.has(w));
  return [...new Set([...eigene, ...ausLabel])].filter(Boolean);
}

// Text in Sätze und Abschnitte zerlegen. Dezimalkommas („2,40“) bleiben erhalten.
function zerlege(text) {
  return String(text || '')
    // Punkte in Abkürzungen sind kein Satzende
    .replace(/\b(ca|bzw|ggf|evtl|nr|z\.\s?b|u\.\s?a)\./gi, (m) => m.replace(/\./g, '\u2024'))
    // Satzende: Punkt/Frage-/Ausrufezeichen/Semikolon vor Leerzeichen oder Textende („2.40“ bleibt eine Zahl)
    .split(/[.!?;](?=\s|$)|\n+/)
    .map((satz) => satz.split(/,\s+|,(?=\D)/).map((t) => t.replace(/\u2024/g, '.').trim()).filter(Boolean))
    .filter((teile) => teile.length);
}

// Findet das Stichwort am Anfang eines Abschnitts (in den ersten drei Wörtern). Liefert { laenge, rest } oder null.
// Mehrwortige Stichwörter („länge sohle“) passen auch in anderer Reihenfolge („Sohle Länge 24 m“);
// das längste passende Stichwort gewinnt.
function treffer(abschnitt, woerter) {
  const n = String(abschnitt).replace(/\s+/g, ' ').trim();
  const anfang = n.split(' ').slice(0, 3).map((w) => w.toLowerCase().replace(/[:,]$/, ''));
  let best = null;
  const nimm = (laenge, restAb) => {
    if (!best || laenge > best.laenge) best = { laenge, rest: n.slice(restAb).replace(/^\s*(:|ist|beträgt|=)\s*/i, '').trim() };
  };
  for (const w of woerter) {
    const re = new RegExp(`^((?:\\S+\\s+){0,2}?)${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?=\\s|$|:)`, 'iu');
    const m = n.match(re);
    if (m) { nimm(w.length, m[0].length); continue; }
    const teile = w.split(' ');
    if (teile.length > 1 && teile.every((t) => anfang.includes(t))) {
      // Rest beginnt nach dem letzten der Stichwort-Wörter
      const letzter = Math.max(...teile.map((t) => anfang.indexOf(t)));
      const ab = n.split(' ').slice(0, letzter + 1).join(' ').length;
      nimm(w.length, ab);
    }
  }
  return best;
}

function datumAusText(t) {
  const m = String(t).match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})$/);
  if (!m) return null;
  return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
}

// Wert für ein Feld aus dem Rest-Text. Liefert { wert, sicher, mass?, hinweis? } oder null.
function wertFuerFeld(feld, rest) {
  const roh = rest.trim();
  const r = norm(roh);
  switch (feld.art) {
    case 'zahl': {
      const b = bewerteMassEingabe(roh, feld);
      if (b.zustand === 'leer') return null;
      return { wert: roh, sicher: b.zustand === 'auto' || b.zustand === 'bestaetigen', bewertung: b };
    }
    case 'janein': {
      if (/\b(nicht vorhanden|nein|kein|keine|fehlt|ohne)\b/.test(r) || r === '') {
        return r === '' ? { wert: true, sicher: false } : { wert: false, sicher: true };
      }
      if (/\b(vorhanden|ja|gibt es)\b/.test(r)) return { wert: true, sicher: true };
      return null;
    }
    case 'auswahl': {
      const o = (feld.optionen || []).find((x) => norm(x) === r || r.includes(norm(x)) || (r.length >= 3 && norm(x).includes(r)));
      return o ? { wert: o, sicher: true } : null;
    }
    case 'mehrfach': {
      const os = (feld.optionen || []).filter((x) => r.includes(norm(x)));
      return os.length ? { wert: os, sicher: true } : null;
    }
    case 'datum': {
      const d = datumAusText(r);
      return d ? { wert: d, sicher: true } : null;
    }
    case 'text':
    case 'langtext':
      return roh ? { wert: roh, sicher: true } : null;
    default:
      return null;
  }
}

// Hauptfunktion. felder: sichtbare, bearbeitbare Felder des Kapitels.
// Ergebnis: Liste von Vorschlägen
//   { typ: 'feld', feldId, wert, sicher, bewertung?, quelle }
//   { typ: 'zeile', feldId, zeile: {spalte: wert}, quelle }  (eine neue Tabellenzeile je Satz)
//   { typ: 'notiz', text }
function werteAus(text, felder) {
  const kandidaten = felder.filter((f) => !f.aus && !['foto', 'skizze', 'tabelle', 'pruefprotokoll'].includes(f.art))
    .map((f) => ({ f, w: stichwoerter(f) }));
  const tabellen = felder.filter((f) => f.art === 'tabelle' && !f.aus);
  const vorschlaege = [];
  for (const satz of zerlege(text)) {
    const offen = [];
    for (const abschnitt of satz) {
      let best = null;
      for (const k of kandidaten) {
        const t = treffer(abschnitt, k.w);
        if (t && (!best || t.laenge > best.t.laenge)) best = { k, t };
      }
      const wert = best ? wertFuerFeld(best.k.f, best.t.rest) : null;
      if (wert) vorschlaege.push({ typ: 'feld', feldId: best.k.f.id, ...wert, quelle: abschnitt });
      else offen.push(abschnitt);
    }
    if (!offen.length) continue;
    // Nicht zugeordnete Abschnitte eines Satzes: als neue Tabellenzeile, wenn das Kapitel genau eine Tabelle hat.
    if (tabellen.length === 1) {
      const tab = tabellen[0];
      const zeile = {};
      const sammel = tab.sammelSpalte || tab.spalten[tab.spalten.length - 1].id;
      const erste = tab.spalten.find((s) => s.art !== 'zahl') || tab.spalten[0];
      offen.forEach((abschnitt, i) => {
        let ziel = null;
        let rest = abschnitt;
        for (const s of tab.spalten) {
          const t = treffer(abschnitt, (s.stichwoerter || []).map(norm));
          if (t) { ziel = s.id; rest = (s.stichwortBehalten ? abschnitt : t.rest) || abschnitt; break; }
        }
        if (!ziel) ziel = i === 0 ? erste.id : sammel;
        zeile[ziel] = zeile[ziel] ? `${zeile[ziel]}; ${rest}` : rest;
      });
      vorschlaege.push({ typ: 'zeile', feldId: tab.id, zeile, quelle: offen.join(', ') });
    } else {
      vorschlaege.push({ typ: 'notiz', text: offen.join(', ') });
    }
  }
  return vorschlaege;
}

return { stichwoerter, zerlege, wertFuerFeld, werteAus };
})();
