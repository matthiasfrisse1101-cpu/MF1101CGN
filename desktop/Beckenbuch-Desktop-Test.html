const Modul_diktat = await (async () => {
// Oberfläche für Maße (Zahlfelder) und das Sammeldiktat je Kapitel.
// Diktiert wird mit dem Mikrofon der Handy-Tastatur – die App nimmt selbst nichts auf.
const { h, leere, meldung, mitwachsen } = Modul_ui;
const { bewerteMassEingabe, massAnzeige, HERKUNFT } = Modul_masse;
const { massText } = Modul_zahlen;
const { werteAus, wertFuerFeld } = Modul_sammeldiktat;
const { feldKey, neueZeilenId } = Modul_gliederung;
// ---------- Zahlfeld mit Maßerkennung ----------
// e: Eintrag im Beckenbuch, setzeWert(text): speichert (e.mass wird vorher gesetzt).
function massFeld(feld, e, setzeWert) {
  const info = h('div', { class: 'mass-info' });
  const inp = h('input', {
    type: 'text', inputmode: 'text', value: e.wert ?? '', autocomplete: 'off', enterkeyhint: 'done',
    placeholder: feld.format === 'verhaeltnis' ? 'z. B. 1 zu 2' : feld.einheit ? `z. B. 2,40 ${feld.einheit}` : '',
    oninput: (ev) => eingabe(ev.target.value),
  });

  const uebernehmen = (mass, text) => {
    e.mass = { ...mass, fuer: text };
    setzeWert(text);
    zeige();
  };
  const eingabe = (text) => {
    const b = bewerteMassEingabe(text, feld);
    if (b.zustand === 'auto') e.mass = { ...b.mass, fuer: text.trim() };
    else if (!e.mass || e.mass.fuer !== text.trim()) e.mass = null;
    setzeWert(text);
    zeige();
  };
  const zeige = () => {
    leere(info);
    const text = String(e.wert ?? '').trim();
    if (!text) return;
    const b = bewerteMassEingabe(text, feld);
    if (e.mass && e.mass.fuer === text) {
      info.append(h('div', { class: 'mass-ok' }, `✓ ${massAnzeige({ mass: e.mass })}`));
    } else if (b.zustand === 'bestaetigen') {
      info.append(h('div', { class: 'vorschlag' }, `Erkannt: ${massText({ erkannt: true, ...b.mass })}${b.hinweis ? ` (${b.hinweis})` : ''}`,
        h('button', { class: 'knopf klein', onclick: () => uebernehmen(b.mass, text) }, 'Übernehmen')));
    } else if (b.zustand === 'umrechnen') {
      info.append(h('div', { class: 'vorschlag' }, `${b.hinweis} `,
        h('button', { class: 'knopf klein', onclick: () => uebernehmen(b.umgerechnet, text) }, `Als ${massText({ erkannt: true, ...b.umgerechnet })} übernehmen`)));
    } else if (b.zustand === 'fremd') {
      info.append(h('div', { class: 'feld-warnung' }, `⚠ ${b.hinweis} Bitte prüfen – bleibt so lange als Text stehen.`));
    } else if (b.zustand === 'unerkannt') {
      info.append(h('div', { class: 'feld-warnung' }, `⚠ Keine Zahl erkannt${b.hinweis && b.hinweis !== 'keine Zahl erkannt' ? ` (${b.hinweis})` : ''} – bleibt als Text, zur Prüfung markiert.`));
    }
  };

  // Herkunft des Maßes
  const herkunft = h('div', { class: 'herkunft' });
  const zeigeHerkunft = () => {
    leere(herkunft);
    for (const [k, t] of Object.entries(HERKUNFT)) {
      herkunft.append(h('button', {
        class: `chip ${e.herkunft === k ? 'aktiv' : ''}`,
        onclick: () => { e.herkunft = e.herkunft === k ? null : k; setzeWert(e.wert ?? ''); zeigeHerkunft(); },
      }, t));
    }
  };
  zeige();
  zeigeHerkunft();
  return h('div', {},
    h('div', { class: 'zahl-zeile' }, inp, feld.einheit && feld.einheit !== '1:n' ? h('span', { class: 'einheit' }, feld.einheit) : null),
    info, herkunft);
}

// ---------- Sammeldiktat ----------
// umgebung: { buch, kap, felder (sichtbar), aendern(buch), neuZeichnen() }
function sammeldiktatBox({ buch, kap, felder, aendern, neuZeichnen }) {
  buch.sammeldiktate = buch.sammeldiktate || {};
  const box = h('details', { class: 'sammeldiktat', open: !!buch.sammeldiktate[kap.id] });
  const liste = h('div', { class: 'vorschlagsliste' });
  const ta = mitwachsen(h('textarea', {
    rows: 3, placeholder: 'Frei diktieren, z. B. „Länge 32 Meter, Breite 14 Meter, Böschung 1 zu 2.“',
    oninput: (ev) => { buch.sammeldiktate[kap.id] = ev.target.value; aendern(buch); },
  }, buch.sammeldiktate[kap.id] || ''));

  const bearbeitbar = felder.filter((f) => !f.aus && !['foto', 'skizze', 'pruefprotokoll'].includes(f.art));
  const auswerten = () => {
    leere(liste);
    const vs = werteAus(ta.value, bearbeitbar);
    if (!vs.length) { liste.append(h('p', { class: 'leer' }, 'Nichts erkannt.')); return; }
    const offen = new Set(vs);
    vs.forEach((v) => liste.append(vorschlagKarte(v, () => offen.delete(v))));
    liste.append(h('button', {
      class: 'knopf primaer breit',
      onclick: () => {
        for (const v of offen) anwenden(v);
        offen.clear();
        buch.sammeldiktate[kap.id] = '';
        aendern(buch);
        meldung('Übernommen.');
        neuZeichnen();
      },
    }, 'Alle übernehmen'));
  };

  // Einen Vorschlag ins Beckenbuch schreiben.
  const anwenden = (v) => {
    const jetzt = new Date().toISOString();
    if (v.ziel === 'verwerfen') return;
    if (v.ziel === 'notiz' || (v.typ === 'notiz' && !v.ziel)) {
      buch.notizen = buch.notizen || {};
      const alt = buch.notizen[kap.id] || '';
      buch.notizen[kap.id] = alt ? `${alt}\n${v.text ?? v.quelle}` : (v.text ?? v.quelle);
      return;
    }
    const f = bearbeitbar.find((x) => x.id === (v.ziel || v.feldId));
    if (!f) return;
    const key = feldKey(kap.id, f.id);
    const e = buch.werte[key] || (buch.werte[key] = { wert: undefined, status: null, geaendert: null });
    if (v.typ === 'zeile') {
      e.wert = [...(Array.isArray(e.wert) ? e.wert : []), { id: neueZeilenId(), ...v.zeile }];
    } else if (f.art === 'zahl') {
      const b = bewerteMassEingabe(v.wert, f);
      e.wert = v.wert;
      // Mit „Übernehmen“ bestätigt; unpassende Einheiten werden nicht umgerechnet und bleiben zur Prüfung.
      e.mass = b.zustand === 'auto' || b.zustand === 'bestaetigen' ? { ...b.mass, fuer: String(v.wert).trim() } : null;
    } else if (f.art === 'langtext' || f.art === 'text') {
      const alt = String(e.wert ?? '').trim();
      e.wert = alt ? `${alt}${f.art === 'langtext' ? '\n' : '; '}${v.wert}` : v.wert;
    } else if (f.art === 'mehrfach') {
      const set = new Set([...(e.wert || []), ...v.wert]);
      e.wert = f.optionen.filter((o) => set.has(o));
    } else {
      e.wert = v.wert;
    }
    e.status = null;
    e.geaendert = jetzt;
  };

  const vorschlagKarte = (v, erledigt) => {
    const karte = h('div', { class: 'zeile-karte' });
    const zeichne = () => {
      leere(karte);
      karte.append(h('div', { class: 'feld-hinweis' }, `„${v.quelle ?? v.text}“`));
      // Ziel wählen
      const sel = h('select', { class: 'ziel-auswahl', onchange: (ev) => {
        v.ziel = ev.target.value;
        const f = bearbeitbar.find((x) => x.id === v.ziel);
        if (f && v.typ !== 'zeile') {
          // Notiz einem Feld zuordnen bzw. anderes Feld wählen: Wert für das neue Feld neu lesen.
          v.quelle = v.quelle ?? v.text;
          const text = v.typ === 'feld' && typeof v.wert === 'string' ? v.wert : String(v.quelle);
          v.typ = 'feld';
          const neu = wertFuerFeld(f, text);
          v.wert = neu ? neu.wert : text;
        }
        zeichne();
      } });
      const ziele = v.typ === 'zeile' ? bearbeitbar.filter((f) => f.id === v.feldId) : bearbeitbar.filter((f) => f.art !== 'tabelle');
      for (const f of ziele) sel.append(h('option', { value: f.id, selected: (v.ziel || v.feldId) === f.id }, `→ ${f.label}`));
      sel.append(h('option', { value: 'notiz', selected: v.ziel === 'notiz' || (!v.ziel && v.typ === 'notiz') }, '→ Notiz zum Kapitel'));
      sel.append(h('option', { value: 'verwerfen', selected: v.ziel === 'verwerfen' }, '✗ verwerfen'));
      karte.append(sel);
      // Wert
      if (v.typ === 'zeile') {
        const tab = bearbeitbar.find((f) => f.id === v.feldId);
        karte.append(h('ul', { class: 'zeilen-vorschau' }, tab.spalten.filter((s) => v.zeile[s.id]).map((s) => h('li', {}, `${s.label}: ${v.zeile[s.id]}`))));
      } else if (v.typ === 'feld' && v.ziel !== 'notiz' && v.ziel !== 'verwerfen') {
        const f = bearbeitbar.find((x) => x.id === (v.ziel || v.feldId));
        const anzeige = typeof v.wert === 'boolean' ? (v.wert ? 'Ja' : 'Nein') : Array.isArray(v.wert) ? v.wert.join(', ') : String(v.wert);
        karte.append(h('div', { class: 'vorschlag-wert' }, h('strong', {}, anzeige)));
        if (f && f.art === 'zahl') {
          const b = bewerteMassEingabe(v.wert, f);
          const t = { auto: '', bestaetigen: `erkannt: ${massText({ erkannt: true, ...b.mass })}`, umrechnen: `${b.hinweis} Wird nicht umgerechnet – im Feld prüfen.`, fremd: b.hinweis, unerkannt: 'keine Zahl erkannt – wird zur Prüfung markiert' }[b.zustand];
          if (t) karte.append(h('div', { class: b.zustand === 'bestaetigen' ? 'feld-hinweis' : 'feld-warnung' }, t));
        }
      }
      karte.append(h('button', {
        class: 'knopf klein', onclick: () => { anwenden(v); erledigt(); aendern(buch); karte.replaceWith(h('p', { class: 'feld-hinweis' }, `✓ ${v.ziel === 'verwerfen' ? 'verworfen' : 'übernommen'}: „${v.quelle ?? v.text}“`)); },
      }, v.ziel === 'verwerfen' ? 'Verwerfen' : 'Übernehmen'));
    };
    zeichne();
    return karte;
  };

  box.append(
    h('summary', {}, h('h2', {}, '🎤 Sammeldiktat')),
    h('p', { class: 'feld-hinweis' }, 'Mit dem Mikrofon der Tastatur frei diktieren. „Auswerten“ schlägt vor, was in welches Feld gehört; jeder Vorschlag wird erst nach „Übernehmen“ eingetragen.'),
    ta,
    h('button', { class: 'knopf breit', onclick: auswerten }, 'Auswerten'),
    liste,
  );
  return box;
}

// ---------- Notizen zum Kapitel ----------
function notizBox(buch, kap, aendern) {
  buch.notizen = buch.notizen || {};
  return h('details', { class: 'abschnitt notizen', open: !!buch.notizen[kap.id] },
    h('summary', {}, h('h2', {}, 'Notizen zum Kapitel')),
    h('p', { class: 'feld-hinweis' }, 'Was sich keinem Feld zuordnen ließ. Erscheint in der Ausgabe als Notiz, nicht als Feld der Vorlage.'),
    mitwachsen(h('textarea', { rows: 2, oninput: (ev) => { buch.notizen[kap.id] = ev.target.value; aendern(buch); } }, buch.notizen[kap.id] || '')));
}

return { massFeld, sammeldiktatBox, notizBox };
})();

// ===== js/protokoll.js =====
const Modul_protokoll = await (async () => {
// Erstkontrolle mit dem Protokoll A 5.2 – Inhalt (Prüfpunkte, Optionen) kommt unverändert aus der Gliederung.
// Je Prüfpunkt: ok oder Schaden (Art des Schadens, Behebung durch, Fotos). Abgelegt im Feld unter C 2.
//
// Wert: { art, artWeil, witterung: [], witterungSonst, anlagenarten: [], anlageSonst, protokollfuehrer, datum,
//         punkte: { 'A.1': { ergebnis: 'ok'|'schaden', schaden, behebung, fotos: [] } }, maengel, wv }
const { h, leere } = Modul_ui;
const { fotoFeld } = Modul_fotos;
const { feldKey, wertVon, sichtbareFelder } = Modul_gliederung;
function vorschlagAnlagenarten(protokoll, g, buch) {
  const labels = (g.teilbauwerke || []).filter((t) => (buch.teilbauwerke || []).includes(t.id)).map((t) => t.label.toLowerCase());
  // Gleiche Bezeichnung; ein Klammerzusatz der Vorlage („… (ohne Absetz- u. Abscheiderfunktion)“) zählt nicht mit.
  return (protokoll.anlagenarten || []).filter((o) => labels.includes(o.toLowerCase().replace(/\s*\(.*\)\s*$/, '').trim()));
}

// Anzahl ok / Schaden / offen
function protokollStand(protokoll, wert) {
  const r = { ok: 0, schaden: 0, offen: 0 };
  for (const gr of protokoll.gruppen) {
    for (const p of gr.punkte) {
      const e = ((wert || {}).punkte || {})[`${gr.id}.${p.nr}`];
      if (e && e.ergebnis === 'ok') r.ok++;
      else if (e && e.ergebnis === 'schaden') r.schaden++;
      else r.offen++;
    }
  }
  return r;
}

function protokollFeld({ g, buch, kap, feld, e, setzeWert, kontext, erfasser }) {
  const pk = g.kapitel.find((k) => k.id === feld.protokoll);
  const p = pk.protokoll;
  const box = h('div', { class: 'protokoll' });
  const w = () => (e.wert && typeof e.wert === 'object' ? e.wert : null);
  const speichern = (aenderung) => {
    const neu = { punkte: {}, ...(w() || {}), ...aenderung };
    setzeWert(neu);
  };

  const start = () => {
    leere(box);
    if (!w()) {
      box.append(h('p', { class: 'feld-hinweis' }, 'Noch keine Erstkontrolle. Sie ist freiwillig.'),
        h('button', {
          class: 'knopf breit',
          onclick: () => { speichern({ protokollfuehrer: erfasser || '', datum: new Date().toISOString().slice(0, 10) }); start(); },
        }, `Erstkontrolle beginnen (${p.titel || 'Protokoll'})`));
      return;
    }
    formular();
  };

  const auswahl = (titel, optionen, wertListe, mehrfach, beiAenderung) => {
    const fs = h('fieldset', { class: 'gruppe' }, h('legend', {}, titel));
    const set = new Set(wertListe || []);
    for (const o of optionen) {
      fs.append(h('label', { class: 'option' },
        h('input', {
          type: mehrfach ? 'checkbox' : 'radio', name: `${feld.id}-${titel}`, checked: set.has(o),
          onchange: (ev) => {
            if (!mehrfach) set.clear();
            if (ev.target.checked) set.add(o); else set.delete(o);
            beiAenderung(optionen.filter((x) => set.has(x)));
          },
        }), h('span', {}, o)));
    }
    return fs;
  };
  const textfeld = (label, wert, beiAenderung, typ = 'text') => h('label', { class: 'feld klein' }, h('span', { class: 'feld-label' }, label),
    h('input', { type: typ, value: wert || '', autocomplete: 'off', oninput: (ev) => beiAenderung(ev.target.value) }));

  const formular = () => {
    const v = w();
    // Kopf: Werte aus dem Kapitel des Protokolls (A 5.2), nur Anzeige
    const kopf = h('div', { class: 'protokoll-kopf' });
    for (const f of sichtbareFelder(pk, buch)) {
      const x = wertVon(g, buch, pk.id, f);
      kopf.append(h('div', {}, h('span', { class: 'feld-label' }, `${f.label}: `), x ? String(x) : h('em', {}, '(noch leer – in ' + (pk.nr || pk.id) + ')')));
    }
    box.append(kopf);

    box.append(auswahl('Protokoll', p.arten || [], v.art ? [v.art] : [], false, (l) => { speichern({ art: l[0] || null }); formularNeu(); }));
    if (v.art && /weil\s*$/.test(v.art)) box.append(textfeld('… weil', v.artWeil, (t) => speichern({ artWeil: t })));
    box.append(auswahl('Angaben zur Witterung', p.witterung || [], v.witterung, true, (l) => { speichern({ witterung: l }); formularNeu(); }));
    if ((v.witterung || []).some((x) => /^sonstige/i.test(x))) box.append(textfeld('Sonstige Witterung', v.witterungSonst, (t) => speichern({ witterungSonst: t })));

    const vor = vorschlagAnlagenarten(p, g, buch).filter((o) => !(v.anlagenarten || []).includes(o));
    if (vor.length) {
      box.append(h('div', { class: 'vorschlag' }, `Vorschlag aus dem Deckblatt: ${vor.join(', ')} `,
        h('button', { class: 'knopf klein', onclick: () => { speichern({ anlagenarten: p.anlagenarten.filter((o) => (v.anlagenarten || []).includes(o) || vor.includes(o)) }); formularNeu(); } }, 'Übernehmen')));
    }
    box.append(auswahl('Art der Anlage (Mehrfachnennung möglich)', p.anlagenarten || [], v.anlagenarten, true, (l) => { speichern({ anlagenarten: l }); formularNeu(); }));
    if ((v.anlagenarten || []).some((x) => /^sonstiges/i.test(x))) box.append(textfeld('Sonstiges', v.anlageSonst, (t) => speichern({ anlageSonst: t })));

    box.append(textfeld('Name Protokollführer', v.protokollfuehrer, (t) => speichern({ protokollfuehrer: t })));
    box.append(textfeld('Kontrolldatum', v.datum, (t) => speichern({ datum: t }), 'date'));

    // Prüfpunkte
    for (const gr of p.gruppen) {
      const sec = h('div', { class: 'pruef-gruppe' }, h('h3', {}, `${gr.id} ${gr.titel}`));
      for (const pt of gr.punkte) sec.append(pruefpunkt(gr, pt));
      box.append(sec);
    }
    box.append(textfeld('Mängelbeseitigung veranlasst', v.maengel, (t) => speichern({ maengel: t })));
    box.append(textfeld('Wv. am', v.wv, (t) => speichern({ wv: t }), 'date'));
    if (p.fussnote) box.append(h('p', { class: 'feld-hinweis' }, p.fussnote));
    box.append(h('p', { class: 'feld-hinweis' }, 'Unterschriften (Prüfer, AM-/SM-Leiter) erfolgen auf dem Ausdruck.'));
  };
  const formularNeu = () => { const y = window.scrollY; leere(box); formular(); window.scrollTo(0, y); };

  const pruefpunkt = (gr, pt) => {
    const key = `${gr.id}.${pt.nr}`;
    const zeile = h('div', { class: 'pruef-punkt' });
    const zeichne = () => {
      leere(zeile);
      const v = w();
      const e2 = (v.punkte || {})[key] || {};
      const setze = (aend) => {
        const punkte = { ...(w().punkte || {}) };
        const neu = { ...(punkte[key] || {}), ...aend }; // aktueller Stand, nicht der beim Zeichnen
        // Ohne Ergebnis entfällt der Punkt – außer er hat schon Schadenstext oder Fotos (nichts geht verloren).
        if (!neu.ergebnis && !neu.schaden && !(neu.fotos || []).length) delete punkte[key]; else punkte[key] = neu;
        speichern({ punkte });
        zeichne();
      };
      zeile.append(h('div', { class: 'pruef-text' }, h('strong', {}, `${gr.id} ${pt.nr}`), ` ${pt.text}`));
      zeile.append(h('div', { class: 'optionen zwei' },
        h('button', { class: `option-knopf ${e2.ergebnis === 'ok' ? 'aktiv' : ''}`, onclick: () => setze({ ergebnis: e2.ergebnis === 'ok' ? null : 'ok' }) }, 'ok'),
        h('button', { class: `option-knopf ${e2.ergebnis === 'schaden' ? 'aktiv schaden' : ''}`, onclick: () => setze({ ergebnis: e2.ergebnis === 'schaden' ? null : 'schaden' }) }, 'Schaden')));
      if (e2.ergebnis === 'schaden') {
        zeile.append(h('label', { class: 'feld klein' }, h('span', { class: 'feld-label' }, 'Art des Schadens'),
          h('input', { type: 'text', value: e2.schaden || '', autocomplete: 'off', oninput: (ev) => { const punkte = { ...w().punkte }; punkte[key] = { ...punkte[key], schaden: ev.target.value }; speichern({ punkte }); } })));
        const beh = h('div', { class: 'herkunft' }, h('span', { class: 'feld-label' }, 'Behebung durch: '));
        for (const b of p.behebung || []) {
          beh.append(h('button', { class: `chip ${e2.behebung === b ? 'aktiv' : ''}`, onclick: () => setze({ behebung: e2.behebung === b ? null : b }) }, b));
        }
        zeile.append(beh);
        zeile.append(fotoFeld({
          kontext, feldKey: feldKey(kap.id, feld.id), ids: e2.fotos || [],
          setzeIds: (ids) => { const punkte = { ...w().punkte }; punkte[key] = { ...punkte[key], fotos: ids }; speichern({ punkte }); },
        }));
      }
    };
    zeichne();
    return zeile;
  };

  start();
  return box;
}

return { vorschlagAnlagenarten, protokollStand, protokollFeld };
})();

const Modul_app = await (async () => {
// Beckenbuch-App – Bildschirme und Ablauf.
const db = Modul_db;
const G = Modul_gliederung;
const { h, leere, meldung, bestaetigen, datumDE, mitwachsen, sprungziel } = Modul_ui;
const { VERSION } = Modul_version;
const { fotoFeld } = Modul_fotos;
const { skizzenFeld, bildschirmSkizze, ladeSkizzen } = Modul_skizzen;
const { eingriffsAbgleich, markenNummern } = Modul_skizzenlogik;
const { urlsFreigeben } = Modul_bilder;
const { massFeld, sammeldiktatBox, notizBox } = Modul_diktat;
const { protokollFeld } = Modul_protokoll;
const app = document.getElementById('app');
const zustand = {
  einstellungen: null, // { id, erfasser, stammdaten: {}, aktiveVorlage }
  testGliederung: null,
};

// ---------- Start ----------
async function start() {
  db.beiSpeicherFehler((e) => meldung(`Speichern fehlgeschlagen: ${e.message || e}`, 'fehler'));
  db.beiSpeicherZustand((n) => {
    const el = document.getElementById('speicheranzeige');

  });
  window.addEventListener('beforeunload', (ev) => {
    if (db.anzahlOffen() > 0) { ev.preventDefault(); ev.returnValue = ''; }
  });

  zustand.einstellungen = (await db.lese('einstellungen', 'einstellungen')) || {
    id: 'einstellungen', erfasser: '', stammdaten: {}, aktiveVorlage: null,
  };
  // Die Desktop-Testversion (eine einzige HTML-Datei) bringt die Test-Gliederung selbst mit.
  zustand.testGliederung = window.BECKENBUCH_TESTGLIEDERUNG
    || await (await fetch('gliederung/test-gliederung.json')).json();

  // Dauerhaften Speicher beantragen (Chrome entscheidet ohne Rückfrage).
  db.dauerhaftBeantragen().catch(() => {});

  window.addEventListener('hashchange', zeige);
  zeige();
  registriereServiceWorker();
}

// Aktive Gliederung: geladenes Vorlagenpaket oder die eingebaute Test-Gliederung.
async function aktiveGliederung() {
  const id = zustand.einstellungen.aktiveVorlage;
  if (id) {
    const v = await db.lese('vorlagen', id);
    if (v) return v.gliederung;
  }
  return zustand.testGliederung;
}

// Gliederung, mit der ein Beckenbuch angelegt wurde.
async function gliederungFuer(buch) {
  const id = vorlagenId(buch.vorlage.name, buch.vorlage.version);
  const v = await db.lese('vorlagen', id);
  if (v) return { g: v.gliederung, passt: true };
  const t = zustand.testGliederung;
  if (t.vorlage === buch.vorlage.name && t.version === buch.vorlage.version) return { g: t, passt: true };
  return { g: await aktiveGliederung(), passt: false };
}

function vorlagenId(name, version) {
  return `${name}@${version}`;
}

function speichereEinstellungen() {
  return db.speichere('einstellungen', zustand.einstellungen);
}

// ---------- Router ----------
async function zeige() {
  const teile = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  urlsFreigeben(); // Vorschaubilder des vorigen Bildschirms freigeben
  try {
    if (teile.length === 0) await bildschirmListe();
    else if (teile[0] === 'neu') await bildschirmNeu();
    else if (teile[0] === 'einstellungen') await bildschirmEinstellungen();
    else if (teile[0] === 'buch' && teile[2] === 'kapitel') await bildschirmKapitel(teile[1], teile[3]);
    else if (teile[0] === 'buch' && teile[2] === 'akten') await bildschirmAkten(teile[1]);
    else if (teile[0] === 'buch' && teile[2] === 'skizze') await bildschirmSkizze({ app, kopf, fuss, ladeBuch, gliederungFuer, aendern }, teile[1], teile[3]);
    else if (teile[0] === 'buch') await bildschirmBuch(teile[1]);
    else location.hash = '#/';
  } catch (e) {
    console.error(e);
    leere(app);
    app.append(kopf('Fehler', '#/'), h('main', {}, h('p', { class: 'fehlertext' }, String(e.message || e))));
  }
  window.scrollTo(0, 0);
  if (sprungziel.key) {
    const ziel = document.getElementById(`feld-${sprungziel.key}`);
    sprungziel.key = null;
    if (ziel) ziel.scrollIntoView({ block: 'start' });
  }
}

    h('h1', {}, titel),
    h('span', { id: 'speicheranzeige', class: 'speicheranzeige' }, db.anzahlOffen() > 0 ? 'speichert …' : 'gespeichert ✓'),
    zusatz || null,
  );
}

function fuss(...knoepfe) {

}

// ---------- Beckenliste ----------

      b.vorlage.testdaten ? h('div', { class: 'marke' }, 'Testvorlage') : null,

  }
  app.append(

    fuss(
      h('a', { class: 'knopf', href: '#/einstellungen' }, 'Einstellungen'),
      h('a', { class: 'knopf primaer', href: '#/neu' }, '+ Neues Beckenbuch'),
    ),
  );
}

// ---------- Neues Beckenbuch ----------
async function bildschirmNeu() {
  const g = await aktiveGliederung();
  const angaben = { name: '', bauwerksnr: '', teilbauwerke: [], freieTeilbauwerke: [] };
  leere(app);
  const main = h('main', {},
    g.testdaten ? h('div', { class: 'hinweis warnung' }, 'Es wird mit der Testvorlage angelegt.') : null,
    h('label', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Name der Anlage'),
      h('input', { type: 'text', autocomplete: 'off', oninput: (e) => { angaben.name = e.target.value; } })),
    h('label', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Bauwerksnummer'),
      h('input', { type: 'text', autocomplete: 'off', oninput: (e) => { angaben.bauwerksnr = e.target.value; } })),
    teilbauwerkAuswahl(g, angaben, () => {}),
  );
  app.append(
    kopf('Neues Beckenbuch', '#/'),
    main,
    fuss(
      h('a', { class: 'knopf', href: '#/' }, 'Abbrechen'),
      h('button', {
        class: 'knopf primaer',
        onclick: async () => {
          if (!angaben.name.trim()) { meldung('Bitte einen Namen eingeben.', 'fehler'); return; }
          await vorlageSicherstellen(g);
          const buch = G.neuesBeckenbuch(g, zustand.einstellungen.stammdaten, angaben);
          await db.speichere('buecher', buch);
          location.hash = `#/buch/${encodeURIComponent(buch.id)}`;
        },
      }, 'Anlegen'),
    ),
  );
}

// Die Testvorlage wird beim ersten Anlegen ebenfalls gespeichert, damit das Beckenbuch
// auch nach einem Update der App seine Gliederung findet.
async function vorlageSicherstellen(g) {
  const id = vorlagenId(g.vorlage, g.version);
  if (!(await db.lese('vorlagen', id))) {
    await db.speichere('vorlagen', { id, gliederung: g, geladen: new Date().toISOString() });
  }
}

function teilbauwerkAuswahl(g, ziel, beiAenderung) {
  const gewaehlt = new Set(ziel.teilbauwerke);
  const box = h('fieldset', { class: 'gruppe' }, h('legend', {}, 'Teilbauwerke (Zutreffendes ankreuzen)'));
  for (const t of g.teilbauwerke || []) {
    const cb = h('input', {
      type: 'checkbox', checked: gewaehlt.has(t.id),
      onchange: (e) => {
        if (e.target.checked) gewaehlt.add(t.id); else gewaehlt.delete(t.id);
        ziel.teilbauwerke = (g.teilbauwerke || []).map((x) => x.id).filter((id) => gewaehlt.has(id));
        beiAenderung('haken');
      },
    });
    box.append(h('label', { class: 'option' }, cb, h('span', {}, t.label)));
  }
  const anzahlFrei = g.freieTeilbauwerke || 0;
  for (let i = 0; i < anzahlFrei; i++) {
    box.append(h('input', {
      type: 'text', class: 'frei', placeholder: 'weiteres Teilbauwerk', value: (ziel.freieTeilbauwerke || [])[i] || '',
      oninput: (e) => { ziel.freieTeilbauwerke = ziel.freieTeilbauwerke || []; ziel.freieTeilbauwerke[i] = e.target.value; beiAenderung('text'); },
    }));
  }
  return box;
}

// ---------- Beckenbuch: Kapitelübersicht ----------
async function ladeBuch(id) {
  const buch = await db.lese('buecher', id);
  if (!buch) throw new Error('Dieses Beckenbuch gibt es nicht (mehr).');
  return buch;
}

function aendern(buch) {
  buch.geaendert = new Date().toISOString();
  return db.speichere('buecher', buch);
}

async function bildschirmBuch(id) {
  const buch = await ladeBuch(id);
  const { g, passt } = await gliederungFuer(buch);
  leere(app);
  const main = h('main', {});
  if (!passt) {
    main.append(h('div', { class: 'hinweis warnung' },
      `Die Vorlage dieses Beckenbuchs (${buch.vorlage.name}, ${buch.vorlage.version}) ist auf diesem Gerät nicht geladen. Angezeigt wird die aktive Vorlage; Felder können fehlen.`));
  }

  // Stand
  const standBox = h('div', { class: 'segment' });
  for (const s of ['in_arbeit', 'vor_ort_fertig', 'vollstaendig']) {
    standBox.append(h('button', {
      class: buch.stand === s ? 'aktiv' : '',
      onclick: async () => { buch.stand = s; await aendern(buch); zeige(); },
    }, G.BUCH_STAND[s]));
  }
  main.append(h('div', { class: 'abschnitt' }, h('h2', {}, 'Stand'), standBox,
    buch.versendet ? h('p', {}, `Versendet am ${datumDE(buch.versendet)}`) : null));

  // Mindestumfang
  const mu = G.mindestumfang(g, buch);
  if (mu.length) {
    const fehlt = mu.filter((m) => !m.erfuellt).length;
    main.append(h('details', { class: 'abschnitt', open: fehlt > 0 },
      h('summary', {}, h('h2', {}, `Mindestumfang ARV Nr. 2: ${fehlt === 0 ? 'vollständig' : `${fehlt} fehlen`}`)),
      h('ul', { class: 'mindest' }, mu.map((m) => h('li', { class: m.erfuellt ? 'ok' : 'fehlt' }, m.erfuellt ? '✓ ' : '✗ ', m.label))),
    ));
  }

  // Kapitel
  const liste = h('div', { class: 'abschnitt' }, h('h2', {}, 'Kapitel'));
  for (const k of G.sichtbareKapitel(g, buch)) {
    const f = G.kapitelFortschritt(g, buch, k);
    const teile = [`${f.geklaert}/${f.gesamt} geklärt`];
    if (f.offen) teile.push(`${f.offen} offen`);
    if (f.aus_akten) teile.push(`${f.aus_akten} aus Akten`);
    if (f.pruefen) teile.push(`${f.pruefen} zur Prüfung`);
    liste.append(h('a', { class: `kapitel-zeile ${f.geklaert === f.gesamt ? 'fertig' : ''}`, href: `#/buch/${encodeURIComponent(buch.id)}/kapitel/${encodeURIComponent(k.id)}` },
      h('span', { class: 'kap-nr' }, k.nr || ''),
      h('span', { class: 'kap-titel' }, k.titel, f.pflichtLeer ? h('span', { class: 'pflicht-marke' }, ` · ${f.pflichtLeer} Pflicht leer`) : null),
      h('span', { class: 'kap-stand' }, teile.join(' · ')),
    ));
  }
  main.append(liste);

  // Zuschaltbare Abschnitte
  const zuschaltbar = g.kapitel.filter((k) => k.zuschaltbar && G.istSichtbar(k, buch));
  if (zuschaltbar.length) {
    const box = h('div', { class: 'abschnitt' }, h('h2', {}, 'Zusätzliche Abschnitte'));
    for (const k of zuschaltbar) {
      const an = (buch.zugeschaltet || []).includes(k.id);
      box.append(h('label', { class: 'option' },
        h('input', {
          type: 'checkbox', checked: an,
          onchange: async (e) => {
            const set = new Set(buch.zugeschaltet || []);
            if (e.target.checked) set.add(k.id); else set.delete(k.id);
            buch.zugeschaltet = g.kapitel.map((x) => x.id).filter((x) => set.has(x));
            await aendern(buch);
            zeige();
          },
        }),
        h('span', {}, `${k.nr} ${k.titel}`, k.quelle ? h('small', {}, ` (aus ${k.quelle})`) : null)));
    }
    main.append(box);
  }

  const akten = G.akteneintraege(g, buch);
  main.append(h('div', { class: 'abschnitt' },
    h('a', { class: 'knopf breit', href: `#/buch/${encodeURIComponent(buch.id)}/akten` }, `Aus den Akten nachzutragen (${akten.length})`),
    h('button', {
      class: 'knopf gefahr breit',
      onclick: async () => {
        const ok = await bestaetigen(`„${G.buchName(buch)}“ endgültig löschen? Das lässt sich nicht rückgängig machen. Ohne Sicherungsdatei sind die Daten verloren.`, 'Endgültig löschen', 'Abbrechen', true);
        if (!ok) return;
        await loescheBuchMitBildern(buch.id);
        meldung('Beckenbuch gelöscht.');
        location.hash = '#/';
      },
    }, 'Beckenbuch löschen'),
  ));

  app.append(kopf(G.buchName(buch), '#/'), main);
}

// Beckenbuch samt seinen Fotos und Skizzen löschen.
async function loescheBuchMitBildern(buchId) {
  for (const store of ['fotos', 'skizzen']) {
    for (const r of await db.alle(store)) if (r.buchId === buchId) await db.loesche(store, r.id);
  }
  await db.loesche('buecher', buchId);
}

// Was Foto- und Skizzenfelder vom Beckenbuch brauchen.
function bildKontext(buch) {
  return { buch, aendern, standortAn: !!zustand.einstellungen.standortFotos, erfasser: zustand.einstellungen.erfasser || '' };
}

// ---------- Aus den Akten ----------
async function bildschirmAkten(id) {
  const buch = await ladeBuch(id);
  const { g } = await gliederungFuer(buch);
  const liste = G.akteneintraege(g, buch);
  leere(app);
  const main = h('main', {},
    h('p', {}, 'Felder mit Status „aus Akten“ und leere Felder, die laut Vorlage aus den Akten kommen.'),
    liste.length === 0 ? h('p', { class: 'leer' }, 'Nichts nachzutragen.') : null,
    liste.map((e) => h('a', { class: 'kapitel-zeile', href: `#/buch/${encodeURIComponent(buch.id)}/kapitel/${encodeURIComponent(e.kapitel.id)}` },
      h('span', { class: 'kap-nr' }, e.kapitel.nr || ''),
      h('span', { class: 'kap-titel' }, e.feld.label),
      h('span', { class: 'kap-stand' }, G.STATUS[e.status]))),
  );
  app.append(kopf('Aus den Akten', `#/buch/${encodeURIComponent(buch.id)}`), main);
}

// ---------- Kapitel erfassen ----------
async function bildschirmKapitel(buchId, kapId) {
  const buch = await ladeBuch(buchId);
  const { g } = await gliederungFuer(buch);
  const kapitelListe = G.sichtbareKapitel(g, buch);
  const idx = kapitelListe.findIndex((k) => k.id === kapId);
  if (idx < 0) { location.hash = `#/buch/${encodeURIComponent(buchId)}`; return; }
  const kap = kapitelListe[idx];
  const zurUebersicht = `#/buch/${encodeURIComponent(buch.id)}`;

  leere(app);
  const main = h('main', {});
  if (kap.hinweis) {
    main.append(h('details', { class: 'hinweis' }, h('summary', {}, 'Hinweis der Vorlage'), h('p', {}, kap.hinweis)));
  }
  for (const t of kap.festtext || []) main.append(h('p', { class: 'festtext' }, t));

  if (kap.id === 'DECK' || (g.testdaten && idx === 0)) {
    main.append(teilbauwerkAuswahl(g, buch, async (art) => {
      await aendern(buch);
      // Ändern sich die Teilbauwerke, können Felder dieses Kapitels ein- oder ausgeblendet werden.
      if (art === 'haken' && (kap.felder || []).some((f) => f.sichtbarWenn)) {
        const y = window.scrollY;
        await bildschirmKapitel(buchId, kapId);
        window.scrollTo(0, y);
      }
    }));
  }

  const felder = G.sichtbareFelder(kap, buch);
  const neuZeichnen = async () => { const y = window.scrollY; await bildschirmKapitel(buchId, kapId); window.scrollTo(0, y); };
  if (felder.some((f) => !f.aus && !['foto', 'skizze', 'pruefprotokoll'].includes(f.art))) {
    main.append(sammeldiktatBox({ buch, kap, felder, aendern, neuZeichnen }));
  }
  for (const feld of felder) main.append(feldBlock(g, buch, kap, feld));
  main.append(notizBox(buch, kap, aendern));

  const naechstes = kapitelListe[idx + 1];
  app.append(
    kopf(`${kap.nr ? kap.nr + ' ' : ''}${kap.titel}`, zurUebersicht),
    main,
    fuss(
      h('a', { class: 'knopf', href: zurUebersicht }, 'Übersicht'),
      naechstes
        ? h('a', { class: 'knopf primaer', href: `#/buch/${encodeURIComponent(buch.id)}/kapitel/${encodeURIComponent(naechstes.id)}` }, `Weiter: ${naechstes.nr || naechstes.titel} ›`)
        : h('a', { class: 'knopf primaer', href: zurUebersicht }, 'Fertig'),
    ),
  );
}

function eintrag(buch, key) {
  if (!buch.werte[key]) buch.werte[key] = { wert: undefined, status: null, geaendert: null };
  return buch.werte[key];
}

function feldBlock(g, buch, kap, feld) {
  const key = G.feldKey(kap.id, feld.id);
  const block = h('section', { class: 'feldblock', id: `feld-${key}` });
  const statusZeile = h('div', { class: 'statuszeile' });

  const marken = [];
  if (feld.pflicht) marken.push(h('span', { class: 'marke pflicht' }, 'Pflicht'));
  if (feld.vorschlag) marken.push(h('span', { class: 'marke' }, 'Vorschlag der App'));
  if (feld.ort === 'akten') marken.push(h('span', { class: 'marke' }, 'Akten'));
  if (feld.ort === 'stammdaten') marken.push(h('span', { class: 'marke' }, 'aus Stammdaten'));

  block.append(h('div', { class: 'feld-kopf' }, h('span', { class: 'feld-label' }, feld.label, feld.einheit && feld.einheit !== '1:n' ? ` [${feld.einheit}]` : ''), ...marken));
  if (feld.hinweis) block.append(h('p', { class: 'feld-hinweis' }, feld.hinweis));

  // Feld, das nur einen anderen Wert anzeigt
  if (feld.aus && (feld.art === 'foto' || feld.art === 'skizze')) {
    const ids = G.wertVon(g, buch, kap.id, feld) || [];
    const [qk, qf] = feld.aus.split('.');
    const quelle = g.kapitel.find((k) => k.id === qk);
    block.append(feld.art === 'foto'
      ? fotoFeld({ kontext: bildKontext(buch), feldKey: feld.aus, ids, setzeIds: () => {}, nurAnzeigen: true })
      : skizzenFeld({ kontext: bildKontext(buch), kap: { id: qk }, feld: { id: qf }, ids, setzeIds: () => {}, nurAnzeigen: true }));
    block.append(h('p', { class: 'feld-hinweis' }, `Kopie aus ${quelle ? (quelle.nr || quelle.id) : qk} – wird automatisch übernommen; ändern dort.`));
    return block;
  }
  if (feld.aus) {
    const w = G.wertVon(g, buch, kap.id, feld);
    block.append(h('p', { class: 'uebernommen' }, w ? String(w) : '(noch leer)', h('small', {}, ' – wird automatisch übernommen')));
    return block;
  }

  const e = eintrag(buch, key);
  const aktualisiereStatus = () => {
    leere(statusZeile);
    const st = G.feldStatus(g, buch, kap.id, feld);
    statusZeile.append(h('span', { class: `status status-${st}` }, G.STATUS[st]));
    for (const s of G.HAND_STATUS) {
      statusZeile.append(h('button', {
        class: `chip ${e.status === s ? 'aktiv' : ''}`,
        onclick: () => {
          e.status = e.status === s ? null : s;
          e.geaendert = new Date().toISOString();
          aendern(buch);
          aktualisiereStatus();
        },
      }, G.STATUS[s]));
    }
  };

  // Bei Eingabe eines Werts wird ein von Hand gesetzter Status aufgehoben.
  const setzeWert = (wert) => {
    e.wert = wert;
    if (!G.istLeer(feld, wert)) e.status = null;
    e.geaendert = new Date().toISOString();
    aendern(buch);
    aktualisiereStatus();
  };

  block.append(eingabe(g, buch, kap, feld, e, setzeWert));
  block.append(statusZeile);
  aktualisiereStatus();
  return block;
}

function eingabe(g, buch, kap, feld, e, setzeWert) {
  switch (feld.art) {
    case 'text':
    case 'datum': {
      const inp = h('input', {
        type: feld.art === 'datum' ? 'date' : 'text', value: e.wert ?? '', autocomplete: 'off',
        oninput: (ev) => setzeWert(ev.target.value),
      });
      const box = h('div', {}, inp);
      if (feld.vorschlagAus) {
        const v = G.vorschlagAusTeilbauwerken(g, buch, feld);
        if (v && v !== e.wert) {
          box.append(h('div', { class: 'vorschlag' }, `Vorschlag: ${v} `,
            h('button', { class: 'knopf klein', onclick: (ev) => { inp.value = v; setzeWert(v); ev.target.parentElement.remove(); } }, 'Übernehmen')));
        }
      }
      return box;
    }
    case 'langtext':
      return mitwachsen(h('textarea', { rows: 3, oninput: (ev) => setzeWert(ev.target.value) }, e.wert ?? ''));
    case 'zahl':
      return massFeld(feld, e, setzeWert);
    case 'pruefprotokoll':
      return protokollFeld({ g, buch, kap, feld, e, setzeWert, kontext: bildKontext(buch), erfasser: zustand.einstellungen.erfasser });
    case 'auswahl': {
      const box = h('div', { class: 'optionen' });
      const zeichne = () => {
        leere(box);
        for (const o of feld.optionen) {
          box.append(h('button', {
            class: `option-knopf ${e.wert === o ? 'aktiv' : ''}`,
            onclick: () => { setzeWert(e.wert === o ? undefined : o); zeichne(); },
          }, o));
        }
      };
      zeichne();
      return box;
    }
    case 'mehrfach': {
      const box = h('div', { class: 'optionen' });
      const zeichne = () => {
        leere(box);
        const set = new Set(e.wert || []);
        for (const o of feld.optionen) {
          box.append(h('button', {
            class: `option-knopf ${set.has(o) ? 'aktiv' : ''}`,
            onclick: () => {
              if (set.has(o)) set.delete(o); else set.add(o);
              setzeWert(feld.optionen.filter((x) => set.has(x)));
              zeichne();
            },
          }, set.has(o) ? `☑ ${o}` : `☐ ${o}`));
        }
      };
      zeichne();
      return box;
    }
    case 'janein': {
      const box = h('div', { class: 'optionen zwei' });
      const zeichne = () => {
        leere(box);
        for (const [w, t] of [[true, 'Ja'], [false, 'Nein']]) {
          box.append(h('button', {
            class: `option-knopf ${e.wert === w ? 'aktiv' : ''}`,
            onclick: () => { setzeWert(e.wert === w ? undefined : w); zeichne(); },
          }, t));
        }
      };
      zeichne();
      return box;
    }
    case 'tabelle': {
      const key = G.feldKey(kap.id, feld.id);
      const box = h('div', {}, tabelle(feld, e, setzeWert, { kontext: bildKontext(buch), key }));
      markenHinweis(g, buch, key, box);
      return box;
    }
    case 'foto':
      return fotoFeld({ kontext: bildKontext(buch), feldKey: G.feldKey(kap.id, feld.id), ids: e.wert || [], setzeIds: setzeWert });
    case 'skizze': {
      let hinweisMarken = '';
      if (feld.marken) {
        const ziel = G.feldIndex(g).get(feld.marken);
        if (ziel) hinweisMarken = `Nummerierte Marken in der Skizze sind mit der Tabelle „${ziel.feld.label}“ verknüpft.`;
      }
      return skizzenFeld({ kontext: bildKontext(buch), kap, feld, ids: e.wert || [], setzeIds: setzeWert, hinweisMarken });
    }
    default:
      return h('p', { class: 'fehlertext' }, `Unbekannte Feldart: ${feld.art}`);
  }
}

// Ist die Tabelle mit den Marken einer Skizze verknüpft (Eingriffsstellen), wird angezeigt,
// welche Nummern nur in der Tabelle oder nur in der Skizze stehen.
async function markenHinweis(g, buch, tabellenKey, box) {
  for (const [skKey, ort] of G.feldIndex(g)) {
    if (ort.feld.marken !== tabellenKey) continue;
    const skizzen = await ladeSkizzen((buch.werte[skKey] || {}).wert || []);
    const zeilen = (buch.werte[tabellenKey] || {}).wert || [];
    const a = eingriffsAbgleich(markenNummern(skizzen), zeilen);
    const texte = [];
    if (a.ohneMarke.length) texte.push(`Nr. ${a.ohneMarke.join(', ')} ist in der ${ort.feld.label} nicht markiert.`);
    if (a.ohneZeile.length) texte.push(`Marke ${a.ohneZeile.join(', ')} der ${ort.feld.label} hat keine Zeile.`);
    if (texte.length) box.prepend(h('div', { class: 'hinweis warnung' }, texte.join(' ')));
  }
}

// bilder: { kontext, key } – nötig, wenn die Tabelle Fotos je Zeile hat (z. B. Unterlagen als Anlage).
function tabelle(feld, e, setzeWert, bilder = null) {
  const box = h('div', { class: 'tabelle' });
  const zeilen = () => (Array.isArray(e.wert) ? e.wert : []);
  const zeichne = () => {
    leere(box);
    zeilen().forEach((z, i) => {
      const karte = h('div', { class: `zeile-karte ${z._vorschlag ? 'vorschlagszeile' : ''}` }, h('div', { class: 'zeile-nr' }, `Zeile ${i + 1}`,
        z._vorschlag ? h('span', { class: 'marke' }, 'Beispiel der Vorlage – bestätigen, ändern oder löschen') : null));
      for (const s of feld.spalten) {
        karte.append(h('label', { class: 'feld klein' }, h('span', { class: 'feld-label' }, s.label),
          h('input', {
            type: 'text', value: z[s.id] ?? '', inputmode: s.art === 'zahl' ? 'decimal' : 'text', autocomplete: 'off',
            oninput: (ev) => {
              z[s.id] = ev.target.value;
              if (z._vorschlag) { delete z._vorschlag; karte.classList.remove('vorschlagszeile'); karte.querySelector('.zeile-nr .marke')?.remove(); karte.querySelector('.bestaetigen')?.remove(); }
              setzeWert([...zeilen()]);
            },
          })));
      }
      if (feld.fotosJeZeile && bilder) {
        karte.append(h('div', { class: 'feld klein' }, h('span', { class: 'feld-label' }, 'Foto der Unterlage (Anlage)'),
          fotoFeld({
            kontext: bilder.kontext, feldKey: bilder.key, ids: z.fotos || [],
            setzeIds: (ids) => { z.fotos = ids; delete z._vorschlag; setzeWert([...zeilen()]); },
          })));
      }
      if (z._vorschlag) {
        karte.append(h('button', {
          class: 'knopf klein bestaetigen',
          onclick: () => { delete z._vorschlag; setzeWert([...zeilen()]); zeichne(); },
        }, 'Übernehmen'), ' ');
      }
      karte.append(h('button', {
        class: 'knopf klein gefahr',
        onclick: async () => {
          if (G.zeileHatInhalt(feld, z) && !(await bestaetigen(`Zeile ${i + 1} löschen?${(z.fotos || []).length ? ' Die Fotos der Zeile werden mitgelöscht.' : ''}`, 'Löschen', 'Abbrechen', true))) return;
          setzeWert(zeilen().filter((x) => x !== z));
          for (const fid of z.fotos || []) await db.loesche('fotos', fid);
          zeichne();
        },
      }, 'Zeile löschen'));
      box.append(karte);
    });
    box.append(h('button', {
      class: 'knopf breit',
      onclick: () => {
        const neu = { id: G.neueZeilenId() };
        if (feld.spalten.some((s) => s.id === 'nr')) neu.nr = String(zeilen().length + 1);
        setzeWert([...zeilen(), neu]);
        zeichne();
        const felder = box.querySelectorAll('.zeile-karte:last-of-type input');
        if (felder[1] || felder[0]) (felder[1] || felder[0]).focus();
      },
    }, '+ Zeile hinzufügen'));
  };
  zeichne();
  return box;
}

// ---------- Einstellungen ----------
async function bildschirmEinstellungen() {
  const g = await aktiveGliederung();
  const es = zustand.einstellungen;
  const vorlagen = await db.alle('vorlagen');
  const speicher = await db.speicherStatus();
  leere(app);
  const main = h('main', {});

  // Erfasser und Stammdaten
  const stamm = h('div', { class: 'abschnitt' }, h('h2', {}, 'Erfasser und Stammdaten'),
    h('p', { class: 'feld-hinweis' }, 'Werden in jedes neue Beckenbuch übernommen und können dort geändert werden. Sie bleiben nur auf diesem Gerät.'),
    h('label', { class: 'feld' }, h('span', { class: 'feld-label' }, 'Erfasser'),
      h('input', { type: 'text', value: es.erfasser || '', oninput: (ev) => { es.erfasser = ev.target.value; speichereEinstellungen(); } })));
  for (const s of g.stammdaten || []) {
    if (s.art === 'tabelle') {
      const e = { wert: es.stammdaten[s.id] || [] };
      stamm.append(h('div', { class: 'feld' }, h('span', { class: 'feld-label' }, s.label),
        tabelle(s, e, (w) => { es.stammdaten[s.id] = w; speichereEinstellungen(); })));
    } else {
      stamm.append(h('label', { class: 'feld' }, h('span', { class: 'feld-label' }, s.label),
        h('input', { type: 'text', value: es.stammdaten[s.id] || '', oninput: (ev) => { es.stammdaten[s.id] = ev.target.value; speichereEinstellungen(); } })));
    }
  }
  main.append(stamm);

  // Fotos
  main.append(h('div', { class: 'abschnitt' }, h('h2', {}, 'Fotos'),
    h('label', { class: 'option' },
      h('input', { type: 'checkbox', checked: !!es.standortFotos, onchange: (ev) => { es.standortFotos = ev.target.checked; speichereEinstellungen(); } }),
      h('span', {}, 'Standort zu jedem Foto speichern (mit angezeigter Genauigkeit)')),
    h('p', { class: 'feld-hinweis' }, 'Aus: kein Standort. An: Das Handy fragt einmal nach der Erlaubnis. Den Standort ermittelt Android; je nach Einstellung des Handys nutzt es dafür auch WLAN- und Mobilfunkdaten.')));

  // Vorlage
  const dateiInput = h('input', {
    type: 'file', accept: '.json,application/json', class: 'versteckt',
    onchange: async (ev) => {
      const datei = ev.target.files[0];
      if (!datei) return;
      try {
        const gl = JSON.parse(await datei.text());
        const fehler = G.pruefeGliederung(gl);
        if (fehler.length) { meldung(`Vorlage fehlerhaft: ${fehler.slice(0, 3).join(' ')}`, 'fehler'); return; }
        const id = vorlagenId(gl.vorlage, gl.version);
        await db.speichere('vorlagen', { id, gliederung: gl, geladen: new Date().toISOString() });
        es.aktiveVorlage = id;
        await speichereEinstellungen();
        meldung(`Vorlage geladen: ${gl.vorlage} (${gl.version})`);
        zeige();
      } catch (e) {
        meldung(`Datei konnte nicht gelesen werden: ${e.message}`, 'fehler');
      }
    },
  });
  const vorlageBox = h('div', { class: 'abschnitt' }, h('h2', {}, 'Vorlage'),
    h('p', {}, 'Aktiv: ', h('strong', {}, g.vorlage), ` (Version ${g.version})`),
    g.testdaten ? h('div', { class: 'hinweis warnung' }, 'Das ist die eingebaute Testvorlage.') : null,
    dateiInput,
    h('button', { class: 'knopf breit', onclick: () => dateiInput.click() }, 'Vorlagenpaket laden …'));
  const echte = vorlagen.filter((v) => !v.gliederung.testdaten);
  if (echte.length > 1 || (echte.length && g.testdaten)) {
    vorlageBox.append(h('p', { class: 'feld-hinweis' }, 'Geladene Vorlagen – für neue Beckenbücher verwenden:'));
    for (const v of vorlagen) {
      vorlageBox.append(h('label', { class: 'option' },
        h('input', { type: 'radio', name: 'vorlage', checked: es.aktiveVorlage === v.id || (!es.aktiveVorlage && v.gliederung.testdaten),
          onchange: async () => { es.aktiveVorlage = v.gliederung.testdaten ? null : v.id; await speichereEinstellungen(); zeige(); } }),
        h('span', {}, `${v.gliederung.vorlage} (${v.gliederung.version})`)));
    }
  }
  main.append(vorlageBox);

  // Speicher
  main.append(h('div', { class: 'abschnitt' }, h('h2', {}, 'Speicher auf diesem Gerät'),
    h('p', {}, 'Dauerhafter Speicher: ', h('strong', {}, speicher.dauerhaft === true ? 'gewährt' : speicher.dauerhaft === false ? 'nicht gewährt' : 'unbekannt')),
    speicher.dauerhaft === false ? h('p', { class: 'feld-hinweis' }, 'Chrome gewährt ihn meist erst, wenn die App auf dem Startbildschirm installiert ist. Bis dahin regelmäßig sichern.') : null,
    speicher.belegtMB !== null ? h('p', {}, `Belegt: ${speicher.belegtMB} MB von ca. ${speicher.verfuegbarMB} MB`) : null,
    h('button', { class: 'knopf breit', onclick: async () => { const ok = await db.dauerhaftBeantragen(); meldung(ok ? 'Dauerhafter Speicher gewährt.' : 'Nicht gewährt – App installieren und erneut versuchen.'); zeige(); } }, 'Dauerhaften Speicher beantragen'),
  ));

  main.append(h('p', { class: 'version' }, `App-Version ${VERSION}`));
  app.append(kopf('Einstellungen', '#/'), main);
}

// ---------- Offline-Betrieb ----------
function registriereServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return; // Desktop-Testversion: Datei liegt ohnehin lokal
  navigator.serviceWorker.register('sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const neu = reg.installing;
      neu && neu.addEventListener('statechange', () => {
        if (neu.state === 'installed' && navigator.serviceWorker.controller) {
          const leiste = document.getElementById('update');
          leiste.hidden = false;
          leiste.onclick = async () => {
            await db.allesGespeichert();
            neu.postMessage('skipWaiting');
          };
        }
      });
    });
  }).catch((e) => console.warn('Service Worker nicht registriert', e));
  let neuGeladen = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (neuGeladen) return;
    neuGeladen = true;
    location.reload();
  });
}

start();

return {  };
})();

</script>
